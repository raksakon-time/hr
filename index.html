<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ================= ตั้งค่า =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwN_t3I53y5PoZY0lGVENHiTvR7Ne_K_OxvTjxfCaAUqyLt3lPPLLBY4gQ8XC2V8ddK/exec";
const LEAVE_SYSTEM_URL = "https://script.google.com/macros/s/AKfycbzZvLTxd5MtGo7_5BQISe8b7KU-759zTWbHeIwsnhlGXI-nte9OwWvfporBCtoeAGk3/exec";
const HOSPITAL_LAT = 17.162383247325145, HOSPITAL_LON = 104.14513206230059, ALLOWED_RADIUS = 100;

const POLL_MS = 30000; // ความถี่ตรวจข้อมูลใหม่ (มิลลิวินาที)

// กะ: [เริ่ม, เลิก, เครดิต] — label สร้างอัตโนมัติ
const SHIFT_DEF = {
  'ด': ['00:00','08:00',1], 'ช616': ['06:00','16:00',1.25], 'ช618': ['06:00','18:00',1.5], 'ช619': ['06:00','19:00',1.625],
  'ช6': ['06:00','14:00',1], 'ช716': ['07:00','16:00',1.125], 'ช719': ['07:00','19:00',1.5], 'ช7': ['07:00','15:00',1],
  'ช21': ['07:00','21:00',1.75], 'ชบ7': ['07:00','23:00',2], 'ช': ['08:00','16:00',1], 'ชบ': ['08:00','00:00',2],
  'ช20': ['08:00','20:00',1.5], 'ช83': ['08:30','16:30',1], 'ช9': ['09:00','21:00',1.5], 'ช917': ['09:00','17:00',1],
  'บ15': ['15:00','23:00',1], 'บ': ['16:00','00:00',1], 'บด': ['16:00','08:00',2], 'บ4': ['17:00','21:00',0.5]
};
const SHIFT_TYPES = Object.fromEntries(Object.entries(SHIFT_DEF).map(([k, [start, end, credit]]) =>
  [k, { start, end, credit, label: `${start.replace(':', '.')} - ${end.replace(':', '.')} (${k})` }]));
const NON_WORK = ['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ลาชั่วโมง', 'ขาด'];
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DAYS = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];

// ================= Helpers =================
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const fmtInput = d => ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
const formatTime24 = d => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const formatDisplayDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${parseInt(y, 10) + 543}`; };
const formatFullThaiDate = d => d ? `${THAI_DAYS[d.getDay()]}ที่ ${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}` : '';
const displaySafeTime = t => !t ? '-' : (t.includes('T') ? t.split('T')[1].substring(0, 5) : t) + ' น.';
const driveImg = (url, size) => { const m = url && url.match(/[-\w]{25,}/); return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=${size}` : url || null; };
const shiftsOf = (sch, date, id) => { const o = sch[date]?.[id]; return o?.shifts || (Array.isArray(o) ? o : []); };
const distM = (a, b, c, d) => {
  const r = x => x * Math.PI / 180, h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
};

// ช่วง 00:00-03:59 ให้นับเป็นกะของเมื่อวานถ้ามีเวรเมื่อวาน (shift ไม่ระบุ = มีเวรเมื่อวานก็ใช้)
const resolveTarget = (now, sch, id, shift) => {
  if (now.getHours() <= 3) {
    const y = fmtInput(new Date(now.getTime() - 864e5)), ys = shiftsOf(sch, y, id);
    if (shift === undefined ? ys.length > 0 : ys.includes(shift)) return { date: y, shifts: ys };
  }
  const t = fmtInput(now);
  return { date: t, shifts: shiftsOf(sch, t, id) };
};

let pendingWrites = 0, writeSeq = 0, syncing = false;
const sendToGoogleSheet = async (action, payload = {}, retries = 3) => {
  const write = action !== 'getInitialData';
  if (write) { pendingWrites++; writeSeq++; }
  try { return await postToSheet_(action, payload, retries); }
  finally { if (write) { pendingWrites--; writeSeq++; } }
};
const postToSheet_ = async (action, payload = {}, retries = 3) => {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
      const data = await res.json();
      if (data.status === 'error') Swal.fire({ title: 'แจ้งเตือน', text: data.message, icon: 'warning', confirmButtonColor: '#db2777' });
      return data;
    } catch (e) {
      console.warn(`การเชื่อมต่อล้มเหลวครั้งที่ ${i + 1}: ${e.message}`);
      if (i === retries - 1) {
        Swal.fire({ title: 'ข้อผิดพลาดเครือข่าย', text: 'การเชื่อมต่อล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ตของท่าน', icon: 'error', confirmButtonColor: '#db2777' });
        return { status: 'error', message: e.message };
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  }
};

const captureImage = v => {
  if (!v || !v.videoWidth || !v.videoHeight) return null;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  c.width = v.videoWidth * .5; c.height = v.videoHeight * .5;
  ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .6).split(',')[1];
};

function useCamera(active, onFail) {
  const ref = useRef(null);
  useEffect(() => {
    if (!active) return;
    let dead = false, tries = 0, timer, stream = null;
    // เก็บ stream ไว้ในตัวแปรนี้เสมอ เพื่อปิดกล้องได้แม้ element วิดีโอถูกถอดไปแล้ว (เดิมกล้องค้างจนเปิดใหม่ได้ภาพดำบน iOS)
    const release = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
    const start = () => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
      if (dead) { s.getTracks().forEach(t => t.stop()); return; }   // ผลมาช้าหลังปิดไปแล้ว: ปล่อยกล้องทิ้ง
      release(); stream = s;
      const v = ref.current;
      if (v) { v.srcObject = s; const p = v.play && v.play(); if (p && p.catch) p.catch(() => {}); }
      // ถ้า 4 วินาทียังไม่มีภาพ (ภาพดำ) ให้เปิดกล้องใหม่ ลองซ้ำไม่เกิน 3 ครั้ง
      timer = setTimeout(() => { if (!dead && ref.current && !ref.current.videoWidth && ++tries < 3) { release(); start(); } }, 4000);
    }).catch(err => { if (!dead) onFail(err); });
    start();
    return () => { dead = true; clearTimeout(timer); release(); if (ref.current) ref.current.srcObject = null; };
  }, [active]);
  return ref;
}

// ================= UI ใช้ร่วมกัน =================
const TONE = {

  secondary: { soft: 'bg-rose-50 text-secondary border-rose-100', ico: 'bg-rose-100 text-secondary', text: 'text-secondary', btn: 'bg-secondary hover:bg-pink-900', main: 'bg-secondary hover:bg-pink-900' }
};
const CARD = 'bg-white rounded-2xl shadow-sm border border-slate-200';
const FIELD = 'w-full min-w-0 max-w-full p-3 sm:p-3.5 border border-slate-300 rounded-xl bg-white outline-none font-semibold text-slate-800';
const LABEL = 'block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider';

const Panel = ({ children }) => <div className="space-y-3 animate-fade-in">{children}</div>;

const ErrorBox = ({ msg }) => msg ? <div className="p-3 bg-red-50 text-red-600 rounded-lg text-sm flex items-start gap-2 border border-red-100 font-medium"><i className="fa-solid fa-circle-exclamation mt-0.5"></i> <span>{msg}</span></div> : null;

const CORNERS = ['top-0 left-0 border-t-4 border-l-4 rounded-tl-xl', 'top-0 right-0 border-t-4 border-r-4 rounded-tr-xl', 'bottom-0 left-0 border-b-4 border-l-4 rounded-bl-xl', 'bottom-0 right-0 border-b-4 border-r-4 rounded-br-xl'];
const CameraBox = ({ active, vref, onOpen, disabled, label, found, ready, dbg, prog, saving }) => (

    {active ? <>
      <video ref={vref} autoPlay playsInline muted className="w-full h-full object-cover transform scale-x-[-1]" />
      <div className="absolute inset-8 pointer-events-none">{CORNERS.map(c => <span key={c} className={`absolute w-10 h-10 transition-colors ${c} ${found ? 'border-green-500' : 'border-white/70'}`}></span>)}</div>
      <p className="absolute bottom-4 inset-x-0 text-center"><span className="inline-block bg-black/60 text-white text-sm font-bold rounded-full px-4 py-1.5">{!ready ? 'กำลังเตรียมระบบสแกน...' : found ? 'พบใบหน้า อยู่นิ่งสักครู่...' : 'จัดใบหน้าให้อยู่ในกรอบ'}</span></p>
      {saving && <div className="absolute inset-0 bg-black/55 flex flex-col items-center justify-center gap-3 text-white"><div className="w-14 h-14 rounded-full border-4 border-white/30 border-t-white animate-spin"></div><p className="text-base font-bold">กำลังบันทึก...</p></div>}
      {FACE_DEBUG && dbg && <p className="absolute top-1 inset-x-0 text-center text-[10px] font-mono text-yellow-300 drop-shadow">{dbg}</p>}
    </> : <button onClick={onOpen} disabled={disabled} className="flex flex-col items-center text-slate-400 hover:text-slate-600 transition-colors">

    </div>

};

const ResultModal = ({ tone, icon, title, time, shiftName, late, onDone }) => (

// ================= ตรวจใบหน้าเข้ากรอบ (face-api tinyFaceDetector เท่านั้น ~190KB) =================
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const FACE_HOLD_MS = 1200;   // ใบหน้าต้องอยู่ในกรอบนิ่งต่อเนื่องกี่มิลลิวินาทีก่อนบันทึกอัตโนมัติ (เพิ่ม = ช้าลง)
const FACE_DEBUG = false; // ชั่วคราว: แสดงสถานะตัวตรวจใบหน้าบนกรอบกล้องเพื่อหาสาเหตุ (ตั้ง false เมื่อใช้งานจริง)
const MANUAL_FALLBACK = true; // true = ถ้าสแกนอัตโนมัติไม่ติด (โหลดตัวตรวจไม่ได้/เกิน 20 วินาที) จะมีปุ่มบันทึกเองให้กด
let liteReady = null, liteDone = false;
const loadFaceLite = () => liteReady || (liteReady = (async () => {
  if (!window.faceapi) throw new Error('faceapi not loaded');
  await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS);
  // วอร์มอัป: ตรวจภาพเปล่า 1 ครั้งเพื่อเตรียมตัวประมวลผล (ครั้งแรกช้า) ให้การสแกนจริงเร็ว
  const c = document.createElement('canvas'); c.width = c.height = 96;
  try { await faceapi.detectSingleFace(c, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 })); } catch (e) { console.warn('face warm-up', e); }
  liteDone = true;
})().catch(e => { liteReady = null; throw e; }));

// ใบหน้าอยู่กลางกรอบ -> คืน true (กรอบเขียว) และถ้าอยู่นิ่งต่อเนื่อง เรียก onStable ครั้งเดียวเพื่อบันทึกอัตโนมัติ
// ถ้าตัวตรวจใบหน้าโหลดไม่ได้จะไม่ทำอะไร ผู้ใช้กดปุ่มยืนยันเองได้ตามเดิม
function useFaceFrame(vref, active, onStable) {
  const [found, setFound] = useState(false), [manual, setManual] = useState(false), [ready, setReady] = useState(liteDone), [dbg, setDbg] = useState(''), [prog, setProg] = useState(0), cb = useRef(onStable);
  cb.current = onStable;
  useEffect(() => {
    if (!active) { setFound(false); setManual(false); setProg(0); return; }
    let stop = false, hits = 0, since = 0, n = 0, lastErr = '';
    const t = setTimeout(() => setManual(true), 20000);
    (async () => {
      for (;;) {   // โหลดไม่สำเร็จให้ลองใหม่เรื่อย ๆ (ระหว่างนั้นปุ่มสำรองจะโผล่ให้กดเองได้)
        try { await loadFaceLite(); break; } catch (e) { setManual(true); await new Promise(res => setTimeout(res, 2000)); if (stop) return; }
      }
      if (stop) return;
      setReady(true);
      while (!stop) {
        const v = vref.current;
        if (v && v.videoWidth && v.readyState >= 2) {   // รอให้เฟรมแรกพร้อมก่อน (ถ้าไม่รออาจเกิด error ในรอบแรก)
          const t0 = performance.now();
          let r = null;
          try { r = await faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 })); }
          catch (e) { lastErr = String((e && e.message) || e).slice(0, 40); console.warn('face detect error', e); }   // ข้ามรอบนี้ ไม่ให้การสแกนหยุดทั้งหมด
          if (stop) break;
          const b = r && r.box, W = v.videoWidth, H = v.videoHeight;
          const ok = !!b && b.width > W * .22 && Math.abs(b.x + b.width / 2 - W / 2) < W * .25 && Math.abs(b.y + b.height / 2 - H / 2) < H * .25;
          n++;
          if (FACE_DEBUG) setDbg(`${W}x${H} rs${v.readyState} #${n} ${Math.round(performance.now() - t0)}ms ` + (b ? `หน้า w${Math.round(b.width / W * 100)}% x${Math.round((b.x + b.width / 2) / W * 100)}% y${Math.round((b.y + b.height / 2) / H * 100)}%` : 'ไม่พบหน้า') + (lastErr ? ' ERR:' + lastErr : ''));
          hits = ok ? hits + 1 : 0;
          if (!ok) since = 0; else if (!since) since = performance.now();
          setProg(ok ? Math.min(1, (performance.now() - since) / FACE_HOLD_MS) : 0);
          setFound(hits >= 1);
          if (hits >= 4 && performance.now() - since >= FACE_HOLD_MS) { stop = true; cb.current(); break; }
        } else if (FACE_DEBUG) setDbg('รอวิดีโอ ' + (v ? v.videoWidth + 'x' + v.videoHeight + ' rs' + v.readyState : 'ไม่มี element'));
        await new Promise(res => setTimeout(res, 100));
      }
    })();
    return () => { stop = true; clearTimeout(t); };
  }, [active]);
  return { found, manual: MANUAL_FALLBACK && manual, ready, dbg, prog };
}

  if (!FESTIVAL_ON) return null;

    return x.from <= x.to ? v >= x.from && v <= x.to : v >= x.from || v <= x.to;
  });
  if (!f) return null;
  const yr = f.from.length === 5 && f.from > f.to && md <= f.to ? y - 1 : y;   // ปีใหม่ใช้ธีมเดียวกันทั้งช่วงข้ามปี

};

  <>

// ================= App =================
function App() {
  const [user, setUser] = useState(null), [tab, setTab] = useState('home'), [imgErr, setImgErr] = useState(false), [formOpen, setFormOpen] = useState(false);
  const [now, setNow] = useState(new Date()), [loading, setLoading] = useState(true), [syncedAt, setSyncedAt] = useState(null);
  const [records, setRecords] = useState([]), [employees, setEmployees] = useState({}), [schedules, setSchedules] = useState({});
  const [settings, setSettings] = useState({ standardWorkDays: {} });

  // อัปเดตเฉพาะตอนนาทีเปลี่ยน (ค่าเดิม = ไม่ render ซ้ำ)
  useEffect(() => {
    const t = setInterval(() => setNow(p => { const n = new Date(); return n.getMinutes() === p.getMinutes() ? p : n; }), 1000);
    return () => clearInterval(t);
  }, []);

  const verRef = useRef(null);
  const applyData = d => {
    setEmployees(d.employees || {}); setRecords(d.records || []); setSchedules(d.schedules || {});
    if (d.settings) setSettings(d.settings);
    verRef.current = d.version;
    setSyncedAt(new Date());
  };
  const quiet = async action => { // เรียกแบบเงียบ ไม่เด้งแจ้งเตือนเมื่อเน็ตสะดุด
    try {
      const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload: {} }) });
      return await r.json();
    } catch (e) { return null; }
  };
  const sync = async () => {
    if (pendingWrites > 0 || syncing) return;   // กำลังบันทึกอยู่ ไม่ดึงข้อมูลมาทับ
    syncing = true;
    const seq = writeSeq;
    try {
      const v = await quiet('getVersion');
      if (v?.status === 'success' && v.version !== verRef.current) {
        const r = await quiet('getInitialData');
        // ถ้ามีการบันทึกเกิดขึ้นระหว่างดึง ให้ทิ้งผลนี้ (รอบถัดไปจะดึงใหม่)
        if (r?.status === 'success' && pendingWrites === 0 && seq === writeSeq) applyData(r.data);
      } else if (v?.status === 'success') setSyncedAt(new Date());   // ข้อมูลเป็นปัจจุบันแล้ว
    } finally { syncing = false; }
  };

  useEffect(() => {
    (async () => {
      const res = await sendToGoogleSheet('getInitialData');
      if (res?.status === 'success') applyData(res.data);
      setLoading(false);
    })();
  }, []);

  // เรียลไทม์แบบ polling: ตรวจเวอร์ชันทุก POLL_MS และทันทีที่กลับมาเปิดหน้า
  useEffect(() => {
    if (!user) return;
    const tick = () => { if (!document.hidden) sync(); };
    const t = setInterval(tick, POLL_MS);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', tick); };
  }, [user]);

  useEffect(() => { loadFaceLite().catch(() => {}); }, []); // โหลดตัวตรวจใบหน้าล่วงหน้า

  if (loading) return (
    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
      <div className="w-10 h-10 border-4 border-gray-200 border-t-primary rounded-full animate-spin mb-4"></div>
      <h2 className="text-gray-600 font-medium">กำลังโหลดข้อมูล...</h2>
    </div>
  );
  if (!user) return <LoginView employees={employees} onLogin={u => { setUser(u); setImgErr(false); }} />;

  const isManager = user.level === 'หัวหน้า' || user.dept === 'ADMIN';
  const role = user.dept === 'ADMIN' ? 'admin' : user.level === 'หัวหน้า' ? 'supervisor' : 'employee';
  const lastPhoto = records.reduce((b, r) => r.empId === user.id && r.photoInUrl && (!b || r.id > b.id) ? r : b, null);
  const avatar = lastPhoto && !imgErr ? driveImg(lastPhoto.photoInUrl, 'w400-h400') : `https://ui-avatars.com/api/?name=${user.fname}+${user.lname}&background=fbcfe8&color=1e293b&size=150`;
  const compact = tab === 'home' && formOpen;
  const fest = festivalFor(now);   // หน้าลงเวลาเข้า/ออก: ย่อแถบชมพู
  const logout = () => { setUser(null); setTab('home'); setImgErr(false); };
  const tabs = [['home', 'fa-solid fa-clock', 'ลงเวลา'], ['calendar', 'fa-regular fa-calendar-days', 'ตารางเวร'], ['history', 'fa-solid fa-clock-rotate-left', 'ประวัติ'],
    ...(isManager ? [['manager', 'fa-solid fa-layer-group', 'จัดการ']] : [])];

  return (
    <div className="min-h-screen flex flex-col bg-slate-50 pb-20 font-sans text-slate-900 relative">
      <div className={`bg-primary ${compact ? 'h-32' : 'h-40'} w-full absolute top-0 left-0 z-0 print-hide rounded-b-[2rem] shadow-sm transition-all overflow-hidden`} style={fest ? { background: fest.art ? 'linear-gradient(180deg,#1e1b4b 0%,#5b21b6 62%,#c2410c 100%)' : fest.bg } : undefined}>
        {fest && fest.art === 'loy' && <LoyPhoto />}

function ClockInModule({ user, now, records, setRecords, schedules, onDone }) {
  const [shift, setShift] = useState(''), [valid, setValid] = useState([]), [loc, setLoc] = useState('checking'), [pos, setPos] = useState(null);
  const [cam, setCam] = useState(false), [scanning, setScanning] = useState(false), [result, setResult] = useState(null), [err, setErr] = useState('');
  const vref = useCamera(cam && !result && loc === 'ok', () => { setErr('ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบการอนุญาต'); setCam(false); });
  const already = shift && records.some(r => r.empId === user.id && r.date === resolveTarget(now, schedules, user.id, shift).date && r.shiftId === shift);
  const canGo = cam && loc === 'ok' && valid.length > 0 && !already;
  const { found: faceOk, manual, ready, dbg, prog } = useFaceFrame(vref, canGo && !scanning && !result, () => handleClockIn());
  // เปิดกล้องอัตโนมัติเมื่อพิกัดผ่านและมีกะเดียว (ถ้ามีหลายกะ ให้เลือกกะก่อนแล้วกดเปิดกล้อง)
  useEffect(() => { if (loc === 'ok' && valid.length === 1 && !already) setCam(true); }, [loc, valid.length, already]);

  useEffect(() => {
    const today = fmtInput(now);
    const active = records.find(r => r.empId === user.id && !r.timeOut && (r.date === today || (now.getHours() <= 8 && r.date === fmtInput(new Date(now.getTime() - 864e5)))));
    if (active) { setErr(`ค้างลงเวลาออกกะ "${SHIFT_TYPES[active.shiftId]?.label || active.shiftId}"`); setLoc('error'); return; }
    const { date, shifts } = resolveTarget(now, schedules, user.id);
    const done = records.filter(r => r.empId === user.id && r.date === date).map(r => r.shiftId);
    const ok = shifts.filter(s => s && !NON_WORK.includes(s) && !done.includes(s));
    setValid(ok);
    if (ok.length) { setShift(ok[0]); checkLocation(); }
    else { setShift(''); setErr(shifts.length && done.length ? 'ลงเวลาครบทุกกะของวันนี้แล้ว' : 'ไม่พบตารางเวรของคุณในระบบ'); setLoc('error'); }
  }, []);

  const checkLocation = () => {
    setLoc('checking'); setErr('');
    if (!navigator.geolocation) { setErr('เบราว์เซอร์ไม่รองรับ GPS'); setLoc('error'); return; }
    const t = setTimeout(() => { setErr('GPS ไม่ตอบสนอง ลองสลับเน็ตหรือรีเฟรชหน้าเว็บ'); setLoc('error'); }, 15000);
    navigator.geolocation.getCurrentPosition(
      ({ coords: { latitude: lat, longitude: lon } }) => {
        clearTimeout(t); setPos({ lat, lon });
        const d = distM(lat, lon, HOSPITAL_LAT, HOSPITAL_LON);
        if (d <= ALLOWED_RADIUS) { setLoc('ok'); setErr(''); } else { setErr(`อยู่นอกพื้นที่ (${Math.round(d)}ม.)`); setLoc('error'); }
      },
      e => { clearTimeout(t); setErr({ 1: 'กรุณาอนุญาตการเข้าถึงตำแหน่ง (Location)', 2: 'สัญญาณ GPS ขัดข้อง', 3: 'หมดเวลาการค้นหาพิกัด' }[e.code] || 'ไม่สามารถระบุตำแหน่งได้'); setLoc('error'); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  };

  const handleClockIn = async () => {
    if (already) { setErr('ไม่อนุญาต: คุณได้ลงเวลาสำหรับกะนี้ไปแล้ว'); setCam(false); return; }
    setErr(''); setScanning(true);
    const photoBase64 = captureImage(vref.current);
    if (!photoBase64) { setErr('จับภาพล้มเหลว รอให้กล้องชัดเจนก่อนกดสแกน'); setScanning(false); return; }
    const sd = SHIFT_TYPES[shift], [h, m] = sd.start.split(':').map(Number);
    const actual = now.getHours() * 60 + now.getMinutes(), deadline = h * 60 + m + 5;
    const tgt = resolveTarget(now, schedules, user.id, shift);
    // วันที่ช่องเวรมี "ลาชั่วโมง" ไม่นับสาย (ระบบไม่ทราบช่วงเวลาที่ลา)
    let dl = deadline;
    if (tgt.shifts.includes('ลาชั่วโมง')) {
      // ไม่ทราบเวลาลา หรือ ลาครอบเวลาเริ่มกะ = ไม่นับสาย / ลาช่วงอื่น (เช่น ท้ายกะ) = นับสายตามปกติ
      const lt = schedules[tgt.date]?.[user.id]?.leaveTime || '', tm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
      const cover = lt.split(';').filter(Boolean).map(x => x.split('-').map(tm)).find(([a, b]) => a <= h * 60 + m && b > h * 60 + m);
      dl = !lt || cover ? Infinity : deadline;
    }
    const isLate = actual > dl && actual < dl + 720;
    const rec = { id: Date.now().toString(), date: tgt.date, empId: user.id, shiftId: shift, timeIn: formatTime24(now), timeOut: null,
      isLate, lateMinutes: isLate ? actual - dl : 0, credit: sd.credit, lat: pos?.lat, lon: pos?.lon, photoBase64 };
    const res = await sendToGoogleSheet('clockIn', rec, 3);
    if (res?.status === 'success') { setRecords([...records, rec]); setResult({ ...rec, shiftName: sd.label }); }
    else if (res?.status === 'error') Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: '#db2777' });
    setScanning(false); setCam(false);
  };

  if (result) return <ResultModal tone="primary" icon="fa-check" title="บันทึกเข้างานสำเร็จ" time={result.timeIn} shiftName={result.shiftName} late={result.isLate ? result.lateMinutes : 0} onDone={onDone} />;

  const locCls = loc === 'ok' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : loc === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-slate-50 border-slate-200 text-slate-600';
  return (
    <Panel>
      <ErrorBox msg={err} />
      <div className="bg-white rounded-xl border border-slate-200 shadow-soft p-3 space-y-2.5">
        {valid.length === 1 ? (
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 shrink-0 rounded-lg bg-pink-100 text-pink-900 text-xl font-bold flex items-center justify-center">{valid[0]}</div>
            <div className="flex-1 min-w-0"><p className="text-xs text-slate-500">กะการทำงาน</p><p className="text-lg font-bold text-slate-800 leading-tight">{SHIFT_TYPES[valid[0]] ? `${SHIFT_TYPES[valid[0]].start.replace(':', '.')} - ${SHIFT_TYPES[valid[0]].end.replace(':', '.')} น.` : valid[0]}</p></div>
            {SHIFT_TYPES[valid[0]] && <p className="text-xs font-bold text-slate-500">เครดิต {SHIFT_TYPES[valid[0]].credit}</p>}
          </div>
        ) : (
          <div>
            <label className={LABEL}>กะการทำงาน</label>
            {valid.length > 0
              ? <select value={shift} onChange={e => setShift(e.target.value)} className={`${FIELD} focus:border-primary`}>{valid.map(k => <option key={k} value={k}>{SHIFT_TYPES[k]?.label || k}</option>)}</select>
              : <div className="w-full p-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-500 text-sm font-medium">ไม่พบตารางเวรที่ลงได้</div>}
          </div>
        )}
        <div className={`p-2.5 rounded-lg flex items-center gap-2 text-sm border font-semibold ${locCls}`}>
          {loc === 'ok' ? <><i className="fa-solid fa-location-dot"></i> พิกัดถูกต้อง · อยู่ในพื้นที่โรงพยาบาล</> : loc === 'error' ? <><i className="fa-solid fa-location-xmark"></i> {err || 'พิกัดอยู่นอกพื้นที่'}</> : <><i className="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบพิกัด...</>}
        </div>
      </div>
      <CameraBox active={cam} vref={vref} onOpen={() => setCam(true)} disabled={loc !== 'ok' || !valid.length || already} label="เปิดกล้องสแกนใบหน้า" found={faceOk} ready={ready} dbg={dbg} prog={prog} saving={scanning} />
      <ScanHint cam={cam} prog={prog} scanning={scanning} color="bg-primary" />
      {manual && canGo && !scanning && <button onClick={handleClockIn} className="w-full p-3 rounded-xl font-bold text-sm text-white bg-primary hover:bg-pink-700 shadow-md">สแกนไม่ติด? กดบันทึกเข้างานเอง</button>}
    </Panel>
  );
}

function ClockOutModule({ user, now, records, setRecords, onDone }) {
  const [outDate, setOutDate] = useState(fmtInput(now)), [found, setFound] = useState(null), [err, setErr] = useState('');
  const [cam, setCam] = useState(false), [scanning, setScanning] = useState(false), [warn, setWarn] = useState(false), [ok, setOk] = useState(null);
  const vref = useCamera(cam && !ok, () => { setErr('ไม่สามารถเข้าถึงกล้องได้'); setCam(false); });
  const { found: faceOk, manual, ready, dbg, prog } = useFaceFrame(vref, cam && !ok && !scanning && !warn && !!found, () => attempt());
  useEffect(() => { if (found) setCam(true); }, [found]);   // เปิดกล้องอัตโนมัติเมื่อพบประวัติเข้างาน

  const search = date => {
    setErr(''); setFound(null); setCam(false);
    const r = records.find(x => x.empId === user.id && x.date === date && !x.timeOut);
    if (!r) setErr('ไม่พบประวัติค้างออกของวันที่เลือก'); else setFound(r);
  };
  useEffect(() => {
    // ถ้าวันนี้ไม่มีรายการค้างออก แต่เมื่อวานมี (เช่น เวรดึก) ให้เลือกวันนั้นให้เลย
    const y = fmtInput(new Date(now.getTime() - 864e5));
    const open = records.filter(r => r.empId === user.id && !r.timeOut && (r.date === outDate || r.date === y)).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (open && open.date !== outDate) setOutDate(open.date);
    search(open ? open.date : outDate);
  }, []);

  const attempt = () => {
    if (!cam) return;
    const sd = SHIFT_TYPES[found.shiftId], [eh, em] = (sd.end === '24:00' ? '23:59' : sd.end).split(':').map(Number), sh = +sd.start.split(':')[0];
    const end = new Date(now); end.setHours(eh, em, 0, 0);
    if (eh < sh && now.getHours() >= 12) end.setDate(end.getDate() + 1);
    now < end ? setWarn(true) : process();
  };

  const process = async () => {
    setWarn(false); setScanning(true); setErr('');
    const photoBase64 = captureImage(vref.current);
    if (!photoBase64) { setScanning(false); return; }
    const timeOut = formatTime24(now);
    const res = await sendToGoogleSheet('clockOut', { id: found.id, timeOut, photoBase64 }, 3);
    if (res?.status === 'success') { setRecords(records.map(r => r.id === found.id ? { ...r, timeOut } : r)); setOk({ timeOut, shiftName: SHIFT_TYPES[found.shiftId]?.label }); }
    else if (res?.status === 'error') Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: '#9d174d' });
    setScanning(false); setCam(false);
  };

  if (ok) return <ResultModal tone="secondary" icon="fa-arrow-right-from-bracket" title="บันทึกออกงานสำเร็จ" time={ok.timeOut} shiftName={ok.shiftName} onDone={onDone} />;

  return (
    <Panel>
      <ErrorBox msg={err} />
      <div className="bg-white rounded-xl border border-slate-200 shadow-soft p-3 space-y-2.5">
        <div>
          <label className={LABEL}>วันที่เข้างาน</label>
          <input type="date" value={outDate} onChange={e => { setOutDate(e.target.value); search(e.target.value); }} className={`${FIELD} focus:border-secondary`} />
        </div>
        {found && (
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 shrink-0 rounded-lg bg-pink-100 text-pink-900 text-xl font-bold flex items-center justify-center">{found.shiftId}</div>
            <div className="flex-1 min-w-0"><p className="text-xs text-slate-500">กะที่บันทึก</p><p className="text-lg font-bold text-slate-800 leading-tight">{SHIFT_TYPES[found.shiftId] ? `${SHIFT_TYPES[found.shiftId].start.replace(':', '.')} - ${SHIFT_TYPES[found.shiftId].end.replace(':', '.')} น.` : found.shiftId}</p></div>
            <div className="text-right"><p className="text-xs text-slate-500">เข้าเมื่อ</p><p className="text-base font-bold text-slate-800">{displaySafeTime(found.timeIn)}</p></div>
          </div>
        )}
      </div>
      {!found ? <div className="text-center py-8 bg-slate-50 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium">ไม่พบประวัติเข้างานของวันที่เลือก</div> : (
        <div className="space-y-3">
          <CameraBox active={cam} vref={vref} onOpen={() => setCam(true)} label="เปิดกล้องสแกนหน้า" found={faceOk} ready={ready} dbg={dbg} prog={prog} saving={scanning} />
          <ScanHint cam={cam} prog={prog} scanning={scanning} color="bg-secondary" />
          {warn ? (
            <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-center shadow-sm">
              <p className="text-amber-800 mb-4 text-sm font-bold">ออกก่อนเวลาเลิกกะ ยืนยันหรือไม่?</p>
              <div className="flex gap-2">
                <button onClick={process} className="flex-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg py-2.5 text-sm font-bold transition-colors">ยืนยัน</button>
                <button onClick={() => setWarn(false)} className="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg py-2.5 text-sm font-bold transition-colors">ยกเลิก</button>
              </div>
            </div>
          ) : (
            <>
              {manual && cam && !scanning && <button onClick={attempt} className="w-full p-3 rounded-xl font-bold text-sm text-white bg-secondary hover:bg-pink-900 shadow-md">สแกนไม่ติด? กดบันทึกออกงานเอง</button>}
            </>
          )}
        </div>
      )}
    </Panel>
  );
}

function MyHistoryView({ user, records, schedules, settings, now }) {
  const [month, setMonth] = useState(`${now.getFullYear()}-${pad(now.getMonth() + 1)}`);
  const mine = records.filter(r => r.empId === user.id && r.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date) || b.timeIn.localeCompare(a.timeIn));
  const late = mine.filter(r => r.isLate).length, lateMin = mine.reduce((a, r) => a + (r.isLate ? Number(r.lateMinutes) || 0 : 0), 0);

  // สรุปเดือน: เครดิตรวม (วิธีเดียวกับหน้าสรุป OT ของหัวหน้า), วันทำงาน, พักร้อน, ลา, OT
  const [y, m] = month.split('-').map(Number), today = fmtInput(now), workDays = parseInt(settings?.standardWorkDays?.[month]) || 22;
  let credit = 0, vac = 0, leave = 0, hourly = 0;
  for (let d = 1, n = new Date(y, m, 0).getDate(); d <= n; d++) {
    const ds = ymd(y, m, d), recs = mine.filter(r => r.date === ds), sched = shiftsOf(schedules, ds, user.id), worked = recs.map(r => r.shiftId);
    credit += recs.reduce((a, r) => a + (r.credit || 0), 0);
    if (sched.some(s => s === 'Vac' || s === 'พักร้อน')) vac++;
    if (sched.some(s => s === 'ลา' || s === 'ป่วย')) leave++;
    if (sched.includes('ลาชั่วโมง')) hourly++;
    sched.filter(s => !worked.includes(s)).forEach(s => { credit += ds >= today ? creditOf(s) : (PAID.includes(s) ? 1 : 0); });
  }
  const f = n => +n.toFixed(3), ot = credit - workDays;
  const stats = [['วันทำงาน', new Set(mine.map(r => r.date)).size, ''], ['Vac', vac, ''], ['ลา', leave, hourly ? `+ลาชม. ${hourly} ครั้ง` : ''], ['OT', (ot > 0 ? '+' : '') + f(ot), ''], ['สาย (ครั้ง)', late, ''], ['สายรวม (นาที)', lateMin, '']];

  return (
    <div className="max-w-md mx-auto space-y-3">
      <PageTitle sub={`แผนก${user.dept}`} title="ประวัติของฉัน" right={<input type="month" aria-label="เลือกเดือน" value={month} onChange={e => setMonth(e.target.value)} className="h-11 rounded-full bg-white/20 text-white text-sm font-bold px-3 outline-none" />} />
      <div className="bg-pink-700 text-white rounded-xl p-3.5 shadow-soft">
        <div className="flex items-end justify-between">
          <div><p className="text-xs font-bold">เครดิตเวร</p><p className="text-[40px] font-bold leading-none">{f(credit)}</p></div>
          <p className="text-xs text-right">รวมเวรล่วงหน้าและลา<br />วันทำการ {workDays}</p>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-3">{stats.map(([l, v, sub]) => (
          <div key={l} className="bg-white/15 rounded-lg px-2.5 py-1.5"><p className="text-xs font-semibold">{l}</p><p className="text-lg font-bold leading-tight">{v}</p>{sub && <p className="text-[11px]">{sub}</p>}</div>))}
        </div>
      </div>
      <div className={`${CARD} px-3.5`}>
        {mine.map((r, i) => {
          const cur = shiftsOf(schedules, r.date, user.id), extra = cur.filter(s => s !== r.shiftId && NON_WORK.includes(s) && s !== 'Off');
          // เวรในตารางไม่ตรงกับที่ลงเวลาไว้ (เช่น สแกน ชบ แล้วถูกเปลี่ยนเป็น ช)
          const warn = !cur.includes(r.shiftId) && (cur.length ? `ตารางเวรวันนี้เปลี่ยนเป็น ${cur.join(', ')} แต่ลงเวลาไว้เป็น ${r.shiftId}` : `ไม่พบเวรของวันนี้ในตารางเวร (ลงเวลาไว้เป็น ${r.shiftId})`);
          const chip = r.isLate ? ['bg-amber-100 text-amber-800', `สาย ${r.lateMinutes} นาที`]
            : !r.timeOut ? (r.date < today ? ['bg-rose-100 text-rose-800', 'ลืมออก'] : ['bg-slate-100 text-slate-700', 'ยังไม่ออก'])
            : ['bg-emerald-100 text-emerald-800', 'ตรงเวลา'];
          return (
            <div key={r.id} className={`py-2.5 ${i ? 'border-t border-slate-200' : ''}`}>
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0">
                  <p className="text-[15px] font-semibold text-slate-800">{formatDisplayDate(r.date).slice(0, 5)} · {r.shiftId}{extra.length ? ', ' + extra.join(', ') : ''}</p>
                  <p className="text-[13px] text-slate-600">เข้า {displaySafeTime(r.timeIn)} · ออก {displaySafeTime(r.timeOut)} · เครดิต {r.credit}</p>
                </div>
                <span className={`text-xs font-bold rounded-full px-2.5 py-1 whitespace-nowrap ${chip[0]}`}>{chip[1]}</span>
              </div>
              {warn && <div className="mt-2 flex gap-2 items-start bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2 text-[13px] font-semibold text-amber-800 leading-snug"><i className="fa-solid fa-triangle-exclamation mt-0.5"></i><span>{warn} · โปรดแจ้ง HR ตรวจสอบ</span></div>}
            </div>
          );
        })}
        {!mine.length && <div className="py-8 text-center text-slate-500 text-sm font-medium">ไม่พบประวัติในเดือนนี้</div>}
      </div>
    </div>
  );
}

const SHIFT_CATEGORY_MAP = { 'ด':{ด:1}, 'ช616':{ช:1,บ:.25}, 'ช618':{ช:1,บ:.5}, 'ช619':{ช:1,บ:.625}, 'ช6':{ช:1}, 'ช716':{ช:1,บ:.125}, 'ช719':{ช:1,บ:.5}, 'ช7':{ช:1}, 'ช21':{ช:1,บ:.75}, 'ชบ7':{ช:1,บ:1}, 'ช':{ช:1}, 'ชบ':{ช:1,บ:1}, 'ช20':{ช:1,บ:.5}, 'ช83':{ช:1}, 'ช9':{ช:1,บ:.5}, 'ช917':{ช:1}, 'บ15':{บ:1}, 'บ':{บ:1}, 'บด':{บ:1,ด:1}, 'บ4':{บ:.5} };
const PAID = ['Vac','พักร้อน','ป่วย','ลา'], LEAVE_LOCK = [...PAID, 'ลาชั่วโมง'], CAT_ORD = { 'ช':1, 'บ':2, 'ด':3 };

// จัดเวรตามกรอบกำลัง: เติมทีละวัน เริ่มจากกะที่หายาก (ดึก > บ > ช+บ > ช) หมุนเวียนคนที่ทำกะนั้นน้อยสุด (เสมอกันดูเครดิตน้อยสุด) ที่ไม่ผิดกติกา
function planFrame({ dates, emps, schedules, frame, maxRun, restNight }) {
  const cur = {}, credit = {}, cnt = {}, updates = [], short = [];
  const prevOf = d => fmtInput(new Date(new Date(d + 'T00:00:00').getTime() - 864e5));
  const getS = (id, d) => cur[id][d] || schedules[d]?.[id]?.shifts || [];
  emps.forEach(id => {
    cur[id] = {}; cnt[id] = {};
    dates.forEach(d => { cur[id][d] = [...(schedules[d]?.[id]?.shifts || [])]; });
    credit[id] = dates.reduce((a, d) => a + cur[id][d].reduce((b, s) => b + creditOf(s), 0), 0);
  });
  const before = { ...credit };
  const prio = s => { const c = SHIFT_CATEGORY_MAP[s] || {}; return c['ด'] ? 0 : c['ช'] ? (c['บ'] ? 2 : 3) : 1; };
  dates.forEach(d => {
    const wk = [0, 6].includes(new Date(d + 'T00:00:00').getDay());
    [...(wk ? frame.we : frame.wd)].sort((a, b) => prio(a.shift) - prio(b.shift)).forEach(({ shift, count }) => {
      const free = id => {
        if (cur[id][d].length) return false;                       // ช่องที่มีเวร/ลา/Off อยู่แล้ว ไม่แตะ
        let p = prevOf(d), run = 0;
        if (restNight && getS(id, p).some(s => s.includes('ด'))) return false; // พักหลังเวรดึก
        while (run < maxRun && getS(id, p).some(s => SHIFT_TYPES[s])) { run++; p = prevOf(p); }
        return run < maxRun;                                         // ทำงานติดกันไม่เกิน maxRun วัน
      };
      const pick = emps.filter(free).sort((a, b) => (cnt[a][shift] || 0) - (cnt[b][shift] || 0) || credit[a] - credit[b] || Math.random() - .5).slice(0, count);
      pick.forEach(id => { cur[id][d] = [shift]; credit[id] += creditOf(shift); cnt[id][shift] = (cnt[id][shift] || 0) + 1; updates.push({ date: d, empId: id, shifts: [shift] }); });
      if (pick.length < count) short.push({ date: d, shift, need: count, got: pick.length });
    });
  });
  return { updates, short, before, credit };
}

      ...matrixEmployees.map(id => { const e = employees[id]; return [id, `${e.fname} ${e.lname}`, e.dept, ...daysArray.map(d => (schedules[dayStr(d)]?.[id]?.shifts || []).join(', ') || '-')]; }), '', ...dailyRows()], `ตารางเวร_${matrixMonth}.csv`);
  };

  // ---------- UI ----------
  const tabBtn = (k, label) => <button key={k} onClick={() => setAdminTab(k)} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${adminTab === k ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>;
  const exportBtn = (fn, ico = 'fa-file-csv') => <button onClick={fn} className={BTN}><i className={`fa-solid ${ico} mr-1.5 text-emerald-600`}></i>ส่งออก</button>;
  const title = adminTab === 'logs' ? 'ประวัติลงเวลา' : adminTab === 'summary' ? 'สรุปภาพรวมแผนกและการเบิก OT' : adminTab === 'schedules' ? 'ตารางเวรปฏิบัติงาน' : (exFilter === 'late' ? 'รายงานพนักงานผู้มาสาย' : 'รายงานพนักงานลืมลงเวลาออก');
  const isMatrix = adminTab === 'summary' || adminTab === 'schedules';
  const chipCls = { worked: 'text-blue-900 bg-blue-100 border-blue-300', pending: 'text-emerald-900 bg-emerald-50 border-emerald-200', absent: 'text-red-900 bg-red-100 border-red-300', leave: 'text-amber-900 bg-amber-50 border-amber-300' };
  const showLate = adminTab === 'summary' && role === 'admin';
  const dayName = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

  return (
    <div className="mt-2 pb-12">
      <div className="hidden print-show text-center mb-6">
        <h2 className="text-2xl font-bold text-black mb-1">{title}</h2>
        <p className="text-base font-bold text-gray-700">แผนก: {filterDept || 'ทั้งหมด'} | ประจำเดือน: {matrixMonth}</p>
      </div>

      {mapRec && <MapModal lat={mapRec.lat} lon={mapRec.lon} onClose={() => setMapRec(null)} />}
      {photoRec && <PhotoModal record={photoRec} employees={employees} onClose={() => setPhotoRec(null)} />}

      {editData && <Modal><div className="p-6"><h3 className="font-bold text-slate-800 mb-4">แก้ไขประวัติ</h3><div className="space-y-4 text-sm">
        <ShiftSelect dept={employees[editData.empId]?.dept} leave={leaveOptions} value={editData.shiftId} onChange={v => setEditData({ ...editData, shiftId: v })} />
        <div className="flex gap-2">
          <input type="time" value={editData.timeIn} onChange={e => setEditData({ ...editData, timeIn: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold" />
          <input type="time" value={editData.timeOut || ''} onChange={e => setEditData({ ...editData, timeOut: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-semibold" />
        </div>
        <Actions onCancel={() => setEditData(null)} onOk={saveEdit} okText="บันทึก" disabled={saving} />
      </div></div></Modal>}

      {addData && <Modal><div className="p-6"><h3 className="font-bold text-slate-800 mb-4">เพิ่มข้อมูลย้อนหลัง</h3><div className="space-y-3 text-sm">
        <input type="text" placeholder="รหัสพนักงาน (EMP01)" value={addData.empId} onChange={e => setAddData({ ...addData, empId: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        <input type="date" value={addData.date} onChange={e => setAddData({ ...addData, date: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        <ShiftSelect dept={employees[addData.empId]?.dept} leave={leaveOptions} empty="-- เลือกกะ --" value={addData.shiftId} onChange={v => setAddData({ ...addData, shiftId: v })} />
        <div className="flex gap-2">
          <input type="time" value={addData.timeIn} onChange={e => setAddData({ ...addData, timeIn: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
          <input type="time" value={addData.timeOut} onChange={e => setAddData({ ...addData, timeOut: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold" />
        </div>
        <Actions onCancel={() => setAddData(null)} onOk={saveAdd} okText={saving ? 'บันทึก...' : 'เพิ่มข้อมูล'} disabled={saving} />
      </div></div></Modal>}

      {cellData && <Modal><div className="p-6">
        <h3 className="font-bold text-slate-800 mb-1">จัดการเวร <span className="text-slate-500 font-semibold text-sm ml-2">{formatDisplayDate(cellData.dateStr)}</span></h3>
        <p className="text-xs font-bold text-primary mb-4">{employees[cellData.empId]?.fname}</p>
        <div className="space-y-2 max-h-48 overflow-y-auto mb-4 pr-1">
          {cellData.shifts.map((s, i) => (
            <div key={i} className="flex gap-2">
              {LEAVE_LOCK.includes(s) ? <div className="flex-1 p-2 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-sm font-bold flex items-center gap-2"><i className="fa-solid fa-lock text-xs"></i>{s}</div> : <ShiftSelect dept={employees[cellData.empId]?.dept} leave={leaveOptions} empty="- ว่าง -" value={s} cls="flex-1 p-2 border border-slate-300 rounded-xl text-sm font-semibold bg-slate-50" onChange={v => { const a = [...cellData.shifts]; a[i] = v; setCellData({ ...cellData, shifts: a }); }} />}
              <button onClick={() => setCellData({ ...cellData, shifts: cellData.shifts.filter((_, k) => k !== i) })} className="w-10 h-10 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors"><i className="fa-solid fa-trash-can"></i></button>
            </div>
          ))}
        </div>
        <button onClick={() => setCellData({ ...cellData, shifts: [...cellData.shifts, ''] })} className="w-full p-2.5 border-2 border-dashed border-slate-300 text-slate-500 font-bold rounded-xl text-sm mb-4 hover:bg-slate-50 transition-colors">+ เพิ่มกะ</button>
        <Actions onCancel={() => setCellData(null)} onOk={saveCell} okText="บันทึก" />
      </div></Modal>}

      {autoOpen && <Modal wide><div className="p-6 max-h-[88vh] overflow-y-auto"><h3 className="font-bold text-slate-800 mb-3">จัดเวรอัตโนมัติ <span className="text-xs font-semibold text-slate-400 ml-1">{filterDept}</span></h3><div className="space-y-3 text-sm">
        <div className="flex bg-slate-100 p-1 rounded-xl">{[['frame', 'ตามกรอบกำลัง'], ['single', 'ใส่กะเดียว']].map(([k, l]) => <button key={k} onClick={() => { setAutoMode(k); setPlan(null); }} className={`flex-1 py-2 rounded-lg font-bold ${autoMode === k ? 'bg-white text-primary shadow-sm' : 'text-slate-500'}`}>{l}</button>)}</div>
        <div className="border border-slate-200 rounded-xl">
          <div className="flex justify-between px-3 py-2 border-b border-slate-100 text-xs font-bold"><span>พนักงานที่จะจัด ({autoEmps.length}/{dropdownEmps.length})</span><span><button onClick={() => setAutoEmps(dropdownEmps)} className="text-primary mr-3">ทั้งหมด</button><button onClick={() => setAutoEmps([])} className="text-slate-500">ล้าง</button></span></div>
          <div className="max-h-32 overflow-y-auto p-2 grid grid-cols-2 gap-1">{dropdownEmps.map(id => <label key={id} className="flex items-center gap-2 p-1 cursor-pointer"><input type="checkbox" checked={autoEmps.includes(id)} onChange={e => setAutoEmps(p => e.target.checked ? [...p, id] : p.filter(x => x !== id))} className="w-4 h-4" /><span className="truncate font-semibold text-slate-700">{employees[id].fname}</span></label>)}</div>
        </div>
        {autoMode === 'single' ? <>
          <ShiftSelect dept={filterDept} leave={leaveOptions} empty="-- เลือกกะ --" value={auto.shiftId} onChange={v => setAuto({ ...auto, shiftId: v })} cls="w-full p-3 rounded-xl border border-slate-300 font-semibold" />
          <select value={auto.dayPattern} onChange={e => setAuto({ ...auto, dayPattern: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 font-semibold"><option value="all">ทุกวัน</option><option value="weekdays">วันธรรมดา</option><option value="weekends">วันหยุด (ส-อา)</option></select>
          <select value={auto.assignMode} onChange={e => setAuto({ ...auto, assignMode: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 font-semibold"><option value="all">ใส่ให้ทุกคนที่เลือก</option><option value="quota">จำกัดโควต้าคน/วัน</option></select>
          {auto.assignMode === 'quota' && <input type="number" min="1" placeholder="จำนวนคน/วัน" value={auto.requiredCount} onChange={e => setAuto({ ...auto, requiredCount: parseInt(e.target.value) || 1 })} className="w-full p-3 rounded-xl border border-slate-300 font-semibold" />}
          <label className="flex items-center gap-2 mt-2 font-semibold text-slate-700 cursor-pointer"><input type="checkbox" checked={auto.overwrite} onChange={e => setAuto({ ...auto, overwrite: e.target.checked })} className="rounded border-slate-300 w-4 h-4" /> เขียนทับกะเดิม (เก็บรายการลาไว้)</label>
          <Actions onCancel={() => setAutoOpen(false)} onOk={runAuto} okText="เริ่มจัดเวร" disabled={saving} />
        </> : plan ? <>
          <p className="font-bold text-slate-700">จัดได้ {plan.updates.length} ช่อง · {plan.short.length ? <span className="text-red-600">ขาดกรอบ {plan.short.length} จุด</span> : <span className="text-emerald-600">ครบตามกรอบ</span>}</p>
          {plan.short.length > 0 && <div className="max-h-24 overflow-y-auto text-xs bg-red-50 border border-red-100 rounded-lg p-2 space-y-0.5">{plan.short.slice(0, 40).map((x, i) => <div key={i}>วันที่ {+x.date.slice(8)} · {x.shift} ขาด {x.need - x.got} (ได้ {x.got}/{x.need})</div>)}</div>}
          <div className="max-h-44 overflow-y-auto border border-slate-200 rounded-lg"><table className="w-full text-xs"><thead className="bg-slate-50 text-slate-500"><tr><th className="p-2 text-left">พนักงาน</th><th className="p-2">ก่อน</th><th className="p-2">หลัง</th><th className="p-2">OT</th></tr></thead>
            <tbody>{autoEmps.map(id => <tr key={id} className="border-t border-slate-100"><td className="p-2 font-semibold">{employees[id].fname}</td><td className="p-2 text-center">{plan.before[id]}</td><td className="p-2 text-center font-bold">{plan.credit[id]}</td><td className="p-2 text-center text-primary font-bold">{plan.credit[id] - localWorkDays}</td></tr>)}</tbody></table></div>
          <p className="text-xs text-slate-400">OT เทียบกับวันทำการ {localWorkDays} วัน ยังไม่บันทึกจนกว่าจะกดยืนยัน</p>
          <Actions onCancel={() => setPlan(null)} onOk={() => commitPlan(plan.updates)} okText="บันทึกเวร" disabled={saving} />
        </> : <>
          {['wd', 'we'].map(k => (
            <div key={k}><p className="font-bold text-slate-600 mb-1">{k === 'wd' ? 'กรอบวันธรรมดา' : 'กรอบวันหยุด (ส-อา)'}</p>
              {frame[k].map((r, i) => (
                <div key={i} className="flex gap-2 mb-1">
                  <ShiftSelect dept={filterDept} leave={[]} value={r.shift} onChange={v => setRow(k, i, { shift: v })} cls="flex-1 p-2 border border-slate-300 rounded-xl font-semibold bg-white" />
                  <input type="number" min="0" value={r.count} onChange={e => setRow(k, i, { count: Number(e.target.value) })} className="w-16 p-2 border border-slate-300 rounded-xl text-center font-bold" />
                  <button onClick={() => setFrame(f => ({ ...f, [k]: f[k].filter((_, j) => j !== i) }))} className="w-9 rounded-xl bg-red-50 text-red-600"><i className="fa-solid fa-trash-can"></i></button>
                </div>))}
              <button onClick={() => setFrame(f => ({ ...f, [k]: [...f[k], { shift: getSortedShiftKeys(filterDept)[0], count: 1 }] }))} className="text-primary text-xs font-bold">+ เพิ่มกะในกรอบ</button>
            </div>))}
          <div className="flex items-center gap-3 flex-wrap text-xs font-semibold text-slate-600">
            <label className="flex items-center gap-1">ทำงานติดกันไม่เกิน <input type="number" min="1" value={params.maxRun} onChange={e => setParams({ ...params, maxRun: Number(e.target.value) || 1 })} className="w-14 p-1 border border-slate-300 rounded-lg text-center" /> วัน</label>
            <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={params.restNight} onChange={e => setParams({ ...params, restNight: e.target.checked })} className="w-4 h-4" /> พักวันถัดไปหลังเวรดึก</label>
          </div>
          <p className="text-xs text-slate-400">เติมเฉพาะช่องที่ยังว่าง ไม่แตะลา/Off/เวรที่จัดไว้แล้ว</p>
          <button onClick={saveFrame} className="text-xs font-bold text-slate-500 hover:text-primary">บันทึกกรอบนี้ไว้ใช้กับแผนก {filterDept}</button>
          <Actions onCancel={() => setAutoOpen(false)} onOk={preview} okText="ดูตัวอย่าง" />
        </>}
      </div></div></Modal>}

      <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 print-hide">
        <div className="flex flex-col sm:flex-row gap-4 sm:items-center justify-between mb-4 border-b border-slate-100 pb-4">
          <div className="flex bg-slate-100 p-1.5 rounded-xl w-fit">{tabBtn('logs', 'ประวัติ')}{tabBtn('summary', 'สรุป OT')}{tabBtn('schedules', 'ตารางเวร')}{tabBtn('exceptions', 'รายงานผิดปกติ')}</div>
          <div className="flex flex-wrap gap-2">
            {adminTab === 'logs' && role === 'admin' && <button onClick={() => setAddData({ empId: '', date: '', shiftId: '', timeIn: '', timeOut: '' })} className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition-colors shadow-sm"><i className="fa-solid fa-plus mr-1.5"></i>เพิ่มย้อนหลัง</button>}
            {adminTab === 'schedules' && <button onClick={openAuto} disabled={!filterDept} className="px-4 py-2 bg-pink-50 hover:bg-pink-100 text-primary border border-pink-200 rounded-lg text-xs font-bold disabled:opacity-50 transition-colors shadow-sm"><i className="fa-solid fa-wand-magic-sparkles mr-1.5"></i>จัดเวรออโต้</button>}
            {exportBtn({ logs: exportLogs, exceptions: exportEx, summary: exportSummary, schedules: exportSchedule }[adminTab], adminTab === 'schedules' ? 'fa-file-excel' : 'fa-file-csv')}
            <button onClick={() => window.print()} className={BTN}><i className="fa-solid fa-print mr-1.5 text-slate-400"></i>พิมพ์</button>
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          {isMatrix
            ? <input type="month" value={matrixMonth} onChange={e => setMatrixMonth(e.target.value)} className={`col-span-2 md:col-span-1 ${IN}`} />
            : <><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className={IN} /><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className={IN} /></>}
          <select value={filterDept} onChange={e => setFilterDept(e.target.value)} disabled={role === 'supervisor'} className={`${IN} bg-white disabled:bg-slate-100 disabled:text-slate-400`}>{role === 'admin' && <option value="">ทุกแผนก</option>}{DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}</select>
          <input type="text" placeholder="ค้นหาชื่อ..." value={filterEmp} onChange={e => setFilterEmp(e.target.value)} className={IN} />
          {isMatrix && (
            <div className="relative col-span-2 md:col-span-1">
              <button onClick={() => setShowDrop(!showDrop)} className="w-full p-2.5 border border-slate-300 rounded-xl font-semibold text-slate-700 bg-white text-left flex justify-between items-center outline-none shadow-sm hover:bg-slate-50">
                <span className="truncate">พนักงาน ({dropdownEmps.filter(id => !excluded.includes(id)).length}/{dropdownEmps.length})</span><i className="fa-solid fa-chevron-down text-slate-400 ml-2"></i>
              </button>
              {showDrop && <>
                <div className="fixed inset-0 z-40" onClick={() => setShowDrop(false)}></div>
                <div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-60 overflow-y-auto p-2 flex flex-col gap-1 top-full left-0">
                  <div className="flex justify-between items-center mb-1 pb-2 border-b border-slate-100 px-1 pt-1">
                    <button onClick={() => setExcluded(p => p.filter(id => !dropdownEmps.includes(id)))} className="text-xs text-primary font-bold hover:underline">เลือกทั้งหมด</button>
                    <button onClick={() => setExcluded(p => [...new Set([...p, ...dropdownEmps])])} className="text-xs text-slate-500 font-bold hover:underline">ล้างทั้งหมด</button>
                  </div>
                  {dropdownEmps.map(id => (
                    <label key={id} className="flex items-center gap-2 p-2 hover:bg-slate-50 rounded cursor-pointer transition-colors">
                      <input type="checkbox" checked={!excluded.includes(id)} onChange={e => setExcluded(p => e.target.checked ? p.filter(x => x !== id) : [...p, id])} className="w-4 h-4 rounded border-slate-300 cursor-pointer" />
                      <span className="text-sm font-semibold text-slate-700 truncate">{employees[id].fname} {employees[id].lname}</span>
                    </label>
                  ))}
                  {!dropdownEmps.length && <div className="text-xs text-slate-400 text-center py-3 font-medium">ไม่พบรายชื่อพนักงาน</div>}
                </div>
              </>}
            </div>
          )}
        </div>
        {adminTab === 'summary' && role === 'admin' && (
          <div className="mt-4 flex items-center gap-3 text-sm bg-pink-50 p-3 rounded-xl border border-pink-100 w-fit">
            <span className="text-primary font-bold"><i className="fa-solid fa-gear mr-2"></i>วันทำการปกติ:</span>
            <input type="number" min="0" value={localWorkDays} onChange={e => setLocalWorkDays(Number(e.target.value))} className="w-16 p-1.5 border border-pink-200 rounded-lg text-center font-bold bg-white text-slate-800" />
            <button onClick={saveSettings} className="px-3 py-1.5 bg-primary hover:bg-pink-700 text-white rounded-lg text-xs font-bold transition-colors">บันทึก</button>
          </div>
        )}
      </div>

      {adminTab === 'logs' && (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm"><div className="overflow-x-auto print-table-wrapper"><table className="min-w-full text-sm text-left">
          <thead className={THEAD}><tr><th className={TH}>วันที่</th><th className={TH}>พนักงาน</th><th className={TH}>กะ</th><th className={`${TH} text-center`}>เข้า</th><th className={`${TH} text-center`}>ออก</th><th className={`${TH} text-center`}>สาย</th><th className={`${TH} text-center print-hide`}>รูป</th>{role === 'admin' && <th className={`${TH} text-right print-hide`}>จัดการ</th>}</tr></thead>
          <tbody className="divide-y divide-slate-100">{filteredRecords.map(r => (
            <tr key={r.id} className="hover:bg-pink-50/50 transition-colors">
              <td className={`${TD} text-slate-500 font-semibold`}>{formatDisplayDate(r.date).slice(0, 5)}</td>
              <EmpCell id={r.empId} emp={employees[r.empId]} /><ShiftCell r={r} /><TimeCells r={r} />
              <td className={`${TD} text-center`}>{r.isLate ? <span className="text-red-700 bg-red-50 border border-red-200 px-2 py-1 rounded text-xs font-bold">{r.lateMinutes} น.</span> : '-'}</td>
              <td className={`${TD} text-center print-hide`}>{(r.photoInUrl || r.photoOutUrl) ? <button onClick={() => setPhotoRec(r)} className="text-primary hover:text-pink-600 bg-pink-50 w-8 h-8 rounded-full flex items-center justify-center mx-auto transition-colors"><i className="fa-solid fa-image"></i></button> : '-'}</td>
              {role === 'admin' && <td className={`${TD} text-right print-hide`}><button onClick={() => setEditData({ ...r })} className="text-slate-400 hover:text-primary mr-3 transition-colors"><i className="fa-solid fa-pen"></i></button><button onClick={() => del(r.id)} className="text-slate-400 hover:text-red-500 transition-colors"><i className="fa-solid fa-trash"></i></button></td>}
            </tr>))}</tbody>
        </table></div></div>
      )}

      {adminTab === 'exceptions' && (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
          <div className="p-4 bg-slate-50 border-b border-slate-200 flex gap-2 print-hide">
            {[['late', 'พนักงานผู้มาสาย'], ['missing_out', 'ลืมลงเวลาออก']].map(([k, l]) => <button key={k} onClick={() => setExFilter(k)} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${exFilter === k ? 'bg-primary text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`}>{l}</button>)}
          </div>
          <div className="overflow-x-auto print-table-wrapper"><table className="min-w-full text-sm text-left">
            <thead className={THEAD}><tr><th className={TH}>วันที่</th><th className={TH}>พนักงาน</th><th className={TH}>กะ</th><th className={`${TH} text-center`}>เข้า</th><th className={`${TH} text-center`}>ออก</th><th className={`${TH} text-center`}>สถานะ</th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              {exceptionRecords.map(r => (
                <tr key={r.id} className="hover:bg-pink-50/50 transition-colors">
                  <td className={`${TD} text-slate-500 font-semibold`}>{formatDisplayDate(r.date).slice(0, 5)}</td>
                  <EmpCell id={r.empId} emp={employees[r.empId]} /><ShiftCell r={r} /><TimeCells r={r} />
                  <td className={`${TD} text-center`}>{exFilter === 'late' ? <span className="text-red-700 bg-red-50 border border-red-200 px-2 py-1 rounded text-xs font-bold">สาย {r.lateMinutes} น.</span> : <span className="text-amber-700 bg-amber-50 border border-amber-200 px-2 py-1 rounded text-xs font-bold">ไม่พบเวลาออก</span>}</td>
                </tr>))}
              {!exceptionRecords.length && <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-500">ไม่พบข้อมูลความผิดปกติในช่วงเวลานี้</td></tr>}
            </tbody>
          </table></div>
        </div>
      )}

      {isMatrix && filterDept && (
        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm print-table-wrapper"><div className="overflow-x-auto">
          <table className="min-w-full text-left" style={{ tableLayout: 'fixed' }}>
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th rowSpan="2" className="px-2 py-3 font-extrabold text-slate-800 text-sm sticky left-0 bg-slate-50 z-20 border-r border-slate-200" style={{ width: '13%' }}>พนักงาน</th>
                {daysArray.map(d => { const di = new Date(my, mm - 1, d).getDay(), wk = di === 0 || di === 6; return <th key={d} rowSpan="2" className={`day-col px-1 py-1.5 text-center text-xs font-extrabold ${wk ? 'text-rose-600 bg-rose-50/50' : 'text-slate-500'}`}><span className="block text-[9px] font-semibold opacity-75">{dayName[di]}</span>{d}</th>; })}
                <th colSpan={types.length} className="px-1 py-1.5 font-extrabold text-primary text-center bg-pink-50/50 border-l border-b border-pink-100 border-r border-slate-200 text-[10px] uppercase tracking-widest" style={{ width: `${types.length * 2.5}%` }}>สรุปกะเวร</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-slate-700 bg-slate-100/50 border-l border-slate-200" style={{ width: '4%' }}>รวม</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-xs font-extrabold text-slate-800 bg-slate-100/50 border-l border-slate-200" style={{ width: '4%' }}>ทำงาน</th>
                <th rowSpan="2" className="px-1 py-3 text-center text-[10px] font-extrabold text-white bg-primary border-l border-pink-600" style={{ width: '4%' }}>OT</th>
                {showLate && <th rowSpan="2" className="px-1 py-3 text-center text-[10px] font-extrabold text-red-700 bg-red-50 border-l border-red-200" style={{ width: '4%' }}>สาย<br />(นาที)</th>}
              </tr>
              <tr>{types.map(t => <th key={t} className="px-1 py-1 font-extrabold text-primary text-center bg-pink-50/50 border-x border-white text-[10px]">{t}</th>)}</tr>
            </thead>
            <tbody className="divide-y divide-slate-100 text-sm">
              {summaryMatrix.map(row => (
                <tr key={row.empId} className="hover:bg-pink-50/30 transition-colors">
                  <td className="px-2 py-2 sticky left-0 bg-white z-10 border-r border-slate-200"><p className="font-bold text-slate-800 leading-tight truncate">{row.fname}</p><p className="text-[9px] font-semibold text-slate-400 truncate mt-0.5">{row.empId} • {row.level}</p></td>
                  {daysArray.map(d => {
                    const wk = [0, 6].includes(new Date(my, mm - 1, d).getDay());
                    if (adminTab === 'schedules') {
                      const ds = dayStr(d), o = schedules[ds]?.[row.empId];
                      return <td key={d} onClick={() => setCellData({ empId: row.empId, dateStr: ds, shifts: [...(o?.shifts || [])] })} className={`day-col px-0.5 py-2 text-center cursor-pointer border-r border-slate-50 hover:bg-slate-100 transition-colors relative ${wk ? 'bg-rose-50/30' : ''}`}>
                        {o?.isEdited && <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-400 rounded-full print-hide"></div>}
                        <div className="flex flex-col gap-0.5 items-center">{(o?.shifts || []).map((s, i) => <span key={i} className="shift-chip bg-white text-slate-800 border border-slate-300 px-1 py-0.5 rounded shadow-sm text-[10px] font-bold">{s}</span>)}</div></td>;
                    }
                    const { ui, absent } = row.shiftsByDay[d];
                    return <td key={d} className={`day-col px-0.5 py-1.5 text-center text-xs font-bold border-r border-slate-50 align-middle ${absent ? 'bg-red-50 ring-1 ring-inset ring-red-200' : (ui.length ? 'bg-slate-50/40' : '')} ${wk && !ui.length ? 'bg-rose-50/30' : ''}`}>
                      {ui.length ? <div className="flex flex-col gap-0.5 items-center justify-center my-0.5">{ui.map((e, i) => <span key={i} className={`shift-chip text-[10px] font-bold px-1 py-0.5 rounded border ${chipCls[e.type]}`} title={e.type === 'pending' ? 'กะล่วงหน้า/รอสแกน' : ''}>{e.shift}</span>)}</div> : <span className="text-slate-300">-</span>}</td>;
                  })}
                  {types.map(t => <td key={t} className="px-1 py-2 text-center font-bold text-primary bg-pink-50/30 border-x border-slate-50 text-[10px]">{row.shiftCounts[t] || 0}</td>)}
                  <td className="px-1 py-2 text-center font-extrabold text-slate-800 bg-slate-50/50 border-l border-slate-200">{row.credit}</td>
                  <td className="px-1 py-2 text-center font-bold text-slate-500 bg-slate-50/50 border-l border-slate-200 text-xs">{localWorkDays}</td>
                  <td className="px-1 py-2 text-center font-extrabold text-primary bg-pink-50 border-l border-pink-100">{row.ot > 0 ? `+${row.ot}` : row.ot}</td>
                  {showLate && <td className="px-1 py-2 text-center font-extrabold text-red-600 bg-red-50 border-l border-red-200">{row.late > 0 ? row.late : '-'}</td>}
                </tr>
              ))}
              {summaryMatrix.length > 0 && (
                <tr className="bg-amber-50/80 border-t-2 border-amber-200">
                  <td className="px-2 py-3 sticky left-0 bg-amber-50 z-10 border-r border-slate-200 font-extrabold text-slate-800 text-right text-xs">สรุปอัตรากำลัง/วัน</td>
                  {daysArray.map(d => {
                    const counts = getDaily(d), wk = [0, 6].includes(new Date(my, mm - 1, d).getDay());
                    return <td key={d} className={`day-col px-0.5 py-1 text-center border-r border-slate-200 align-top ${wk ? 'bg-rose-50/50' : ''}`}>
                      {Object.keys(counts).length ? <div className="flex flex-col gap-0.5 mt-1 pb-1">{Object.entries(counts).sort((a, b) => byCat(a[0], b[0])).map(([s, c]) => <div key={s} className="text-[9px] font-extrabold text-slate-700 leading-tight">{s}: <strong className="text-primary">{c}</strong></div>)}</div> : <span className="text-slate-300">-</span>}</td>;
                  })}
                  <td colSpan={types.length + (showLate ? 4 : 3)} className="bg-amber-50 border-l border-slate-200"></td>
                </tr>
              )}
            </tbody>
          </table>
        </div></div>
      )}
      {isMatrix && !filterDept && (
        <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm print-hide">
          <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100"><i className="fa-solid fa-building text-3xl text-primary/50"></i></div>
          <h3 className="text-lg font-bold text-slate-800 mb-1">ยังไม่ได้เลือกแผนก</h3>
          <p className="text-slate-500 font-medium">กรุณาเลือกแผนกจากเมนูด้านบนเพื่อดูตารางเวร</p>
        </div>
      )}
    </div>
  );
}
</script>

</body>
</html>
