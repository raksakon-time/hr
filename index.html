<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลา รพ.รักษ์สกล</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0,0,0,0.04)',
                        'subtle': '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03)',
                    },
                    colors: {
                        /* Enterprise Theme: Neutral Gray & Slate */
                        primary: '#111827', // Gray 900
                        secondary: '#4b5563', // Gray 600
                        accent: '#2563eb', // Blue 600
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f9fafb; -webkit-font-smoothing: antialiased; color: #1f2937; font-size: 15px; margin: 0; padding: 0;}
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modern Inputs */
        input[type="text"], input[type="password"], input[type="time"], input[type="date"], input[type="month"], select {
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #111827 !important;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
        }
        select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.25em 1.25em; padding-right: 2.5rem; }
        
        /* Print CSS Preserved & Enhanced for Large Fonts */
        .print-show { display: none; }
        @media print {
            body { font-size: 10pt; background: white; color: black; margin: 0; padding: 0; }
            nav, .print-hide, .bottom-nav-hide { display: none !important; }
            .print-show { display: block !important; }
            main.max-w-7xl { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; max-width: none !important; border-radius: 0 !important; }
            .print-table-wrapper { overflow-x: visible !important; border: none !important; }
            table { width: 100% !important; border-collapse: collapse !important; page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid #d1d5db !important; padding: 2px 4px !important; font-size: 12px !important; color: black !important; }
            th { background-color: #f3f4f6 !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            
            /* บังคับฟอนต์พิมพ์ตัวใหญ่และหนาขึ้นสำหรับกะเวร */
            td span:not(.shift-chip) { background: none !important; border: none !important; color: black !important; box-shadow: none !important; padding: 0 !important; }
            td .shift-chip { font-size: 13pt !important; font-weight: 800 !important; color: black !important; background: transparent !important; border: none !important; box-shadow: none !important; display: inline-block; padding: 1px !important; }
            td .shift-chip strong { font-size: 14pt !important; font-weight: 900 !important; }
            
            @page { size: A4 landscape; margin: 8mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚠️ การตั้งค่า URL
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwN_t3I53y5PoZY0lGVENHiTvR7Ne_K_OxvTjxfCaAUqyLt3lPPLLBY4gQ8XC2V8ddK/exec"; 
        const LEAVE_SYSTEM_URL = "https://script.google.com/macros/s/AKfycbzZvLTxd5MtGo7_5BQISe8b7KU-759zTWbHeIwsnhlGXI-nte9OwWvfporBCtoeAGk3/exec"; 

        const HOSPITAL_LAT = 17.162383247325145;
        const HOSPITAL_LON = 104.14513206230059;
        const ALLOWED_RADIUS = 100;

        const DEPARTMENTS = [
            "HR-IT", "บัญชี", "การเงินผู้ป่วย-สิทธิประโยชน์", "OPD", "NA OPD", "IPD", "NA IPD", "ห้องยา",
            "ห้องปฏิบัติการทางการแพทย์", "เอกซเรย์", "OR-LR", "แม่บ้าน", "ซักฟอก",
            "หน่วยจ่ายกลาง", "โภชนาการ", "เปล-ยานยนต์", "ช่าง", "เวชระเบียน", "ส่งเสริมสุขภาพ",
            "ADMIN"
        ];

        const DEPT_SHIFTS = {
            "HR-IT": ['ช7', 'ช'],
            "บัญชี": ['ช', 'ช83'],
            "การเงินผู้ป่วย-สิทธิประโยชน์": ['ช', 'ชบ'],
            "OPD": ['ช6', 'ช7', 'ช716','ช917', 'ช21', 'ช', 'ชบ', 'ช9', 'บ', 'ด', 'บ4'],
            "NA OPD": ['ช6', 'ช7', 'ช716','ช917', 'ช21', 'ช', 'ชบ', 'ช9', 'บ', 'ด', 'บ4'],
            "IPD": ['ช', 'บ', 'ด', 'ชบ', 'บด'],
            "NA IPD": ['ช', 'บ', 'ด', 'ชบ', 'บด'],
            "ห้องยา": ['ช', 'บ', 'ด', 'ชบ', 'บด', 'ช20'],
            "ห้องปฏิบัติการทางการแพทย์": ['ช', 'ช7', 'ชบ7', 'บ15', 'ช20', 'ช719'],
            "เอกซเรย์": ['ช', 'ชบ', 'ช7','บ'],
            "OR-LR": ['ช'],
            "แม่บ้าน": ['ช7', 'ชบ7', 'บ15'],
            "ซักฟอก": ['ช'],
            "หน่วยจ่ายกลาง": ['ช', 'ช716', 'ช7'],
            "โภชนาการ": ['ช6', 'ช', 'ช616', 'ช618'],
            "เปล-ยานยนต์": ['ช', 'ชบ', 'บ' , 'ด'],
            "ช่าง": ['ช'],
            "เวชระเบียน": ['ช7', 'ช', 'ช20', 'ชบ', 'ช917', 'บ', 'ด'],
            "ส่งเสริมสุขภาพ": ['ช7', 'ช'],
            "ADMIN": ['ช', 'ช83']
        };

        const SHIFT_TYPES = {
            'ด': { start: '00:00', end: '08:00', credit: 1, label: '00.00 - 08.00 (ด)' },
            'ช616': { start: '06:00', end: '16:00', credit: 1.25, label: '06.00 - 16.00 (ช616)' },
            'ช618': { start: '06:00', end: '18:00', credit: 1.5, label: '06.00 - 18.00 (ช618)' },
            'ช619': { start: '06:00', end: '19:00', credit: 1.625, label: '06.00 - 19.00 (ช619)' },
            'ช6': { start: '06:00', end: '14:00', credit: 1, label: '06.00 - 14.00 (ช6)' },
            'ช716': { start: '07:00', end: '16:00', credit: 1.125, label: '07.00 - 16.00 (ช716)' },
            'ช719': { start: '07:00', end: '19:00', credit: 1.5, label: '07.00 - 19.00 (ช719)' },
            'ช7': { start: '07:00', end: '15:00', credit: 1, label: '07.00 - 15.00 (ช7)' },
            'ช21': { start: '07:00', end: '21:00', credit: 1.75, label: '07.00 - 21.00 (ช21)' },
            'ชบ7': { start: '07:00', end: '23:00', credit: 2, label: '07.00 - 23.00 (ชบ7)' },
            'ช': { start: '08:00', end: '16:00', credit: 1, label: '08.00 - 16.00 (ช)' },
            'ชบ': { start: '08:00', end: '00:00', credit: 2, label: '08.00 - 00.00 (ชบ)' },
            'ช20': { start: '08:00', end: '20:00', credit: 1.5, label: '08.00 - 20.00 (ช20)' },
            'ช83': { start: '08:30', end: '16:30', credit: 1, label: '08.30 - 16.30 (ช83)' },
            'ช9': { start: '09:00', end: '21:00', credit: 1.5, label: '09.00 - 21.00 (ช9)' },
            'ช917': { start: '09:00', end: '17:00', credit: 1, label: '09.00 - 17.00 (ช917)' },
            'บ15': { start: '15:00', end: '23:00', credit: 1, label: '15.00 - 23.00 (บ15)' },
            'บ': { start: '16:00', end: '00:00', credit: 1, label: '16.00 - 00.00 (บ)' },
            'บด': { start: '16:00', end: '08:00', credit: 2, label: '16.00 - 08.00 (บด)' },
            'บ4': { start: '17:00', end: '21:00', credit: 0.5, label: '17.00 - 21.00 (บ4)' },
        };

        const getSortedShiftKeys = (deptName) => {
            let keys = Object.keys(SHIFT_TYPES);
            if (deptName && DEPT_SHIFTS[deptName]) {
                keys = keys.filter(k => DEPT_SHIFTS[deptName].includes(k));
            }
            return keys.sort((a, b) => {
                const startCmp = SHIFT_TYPES[a].start.localeCompare(SHIFT_TYPES[b].start);
                if (startCmp !== 0) return startCmp;
                return SHIFT_TYPES[a].label.localeCompare(SHIFT_TYPES[b].label);
            });
        };

        const sendToGoogleSheet = async (action, payload = {}, retries = 3) => {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, payload: payload })
                    });
                    const data = await response.json();
                    if (data.status === 'error') {
                        Swal.fire({ title: 'แจ้งเตือน', text: data.message, icon: 'warning', confirmButtonColor: '#111827' });
                    }
                    return data; 
                } catch (error) {
                    console.warn(`การเชื่อมต่อล้มเหลวครั้งที่ ${i + 1}: ${error.message}`);
                    if (i === retries - 1) {
                        Swal.fire({
                            title: 'ข้อผิดพลาดเครือข่าย',
                            text: 'การเชื่อมต่อล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ตของท่าน',
                            icon: 'error',
                            confirmButtonColor: '#111827'
                        });
                        return { status: 'error', message: error.message };
                    }
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
            }
        };

        const captureImage = (videoElement) => {
            if (!videoElement || videoElement.videoWidth === 0 || videoElement.videoHeight === 0) return null;
            const canvas = document.createElement('canvas');
            const scale = 0.5; 
            canvas.width = videoElement.videoWidth * scale;
            canvas.height = videoElement.videoHeight * scale;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
        };

        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            const thaiYear = parseInt(year, 10) + 543;
            return `${day}/${month}/${thaiYear}`;
        };

        const formatTime24 = (dateObj) => {
            if (!dateObj) return '';
            const h = String(dateObj.getHours()).padStart(2, '0');
            const m = String(dateObj.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        };

        const displaySafeTime = (timeStr) => {
            if (!timeStr) return '-';
            if (timeStr.includes('T')) return timeStr.split('T')[1].substring(0, 5) + ' น.';
            return timeStr + ' น.';
        };

        const MapModal = ({ lat, lon, onClose }) => (
            <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl w-full max-w-lg shadow-soft overflow-hidden border border-gray-200 animate-fade-in">
                    <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100">
                        <h3 className="font-semibold text-gray-900 text-lg">พิกัดลงเวลา</h3>
                        <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-900 transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <iframe src={`https://maps.google.com/maps?q=${lat},${lon}&hl=th&z=17&output=embed`} width="100%" height="350" frameBorder="0" className="bg-gray-50" />
                </div>
            </div>
        );

        const PhotoModal = ({ record, employees, onClose }) => {
            const emp = employees[record.empId] || {};
            const getPreviewUrl = (url) => {
                if (!url) return null;
                const match = url.match(/[-\w]{25,}/);
                if (match && match[0]) return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w800`;
                return url;
            };

            return (
                <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-md shadow-soft overflow-hidden flex flex-col border border-gray-200 animate-fade-in">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 shrink-0">
                            <h3 className="font-semibold text-gray-900 text-lg">รูปสแกนใบหน้า</h3>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-900 transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="p-6 bg-gray-50 flex gap-5 h-72 overflow-hidden">
                            {record.photoInUrl ? (
                                <div className="flex-1 flex flex-col">
                                    <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 text-center">เข้างาน</p>
                                    <div className="w-full flex-1 border border-gray-200 rounded-xl bg-white shadow-subtle overflow-hidden flex items-center justify-center">
                                        <img src={getPreviewUrl(record.photoInUrl)} className="w-full h-full object-cover transform scale-x-[-1]" alt="Check In" onError={(e) => { e.target.style.display = 'none'; e.target.parentElement.innerHTML = '<i class="fa-solid fa-image text-gray-300 text-2xl"></i>'; }} />
                                    </div>
                                </div>
                            ) : <div className="flex-1 flex flex-col items-center justify-center border border-dashed border-gray-200 rounded-xl bg-white"><i className="fa-regular fa-image text-gray-300 text-2xl"></i></div>}
                            
                            {record.photoOutUrl ? (
                                <div className="flex-1 flex flex-col">
                                    <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 text-center">ออกงาน</p>
                                    <div className="w-full flex-1 border border-gray-200 rounded-xl bg-white shadow-subtle overflow-hidden flex items-center justify-center">
                                        <img src={getPreviewUrl(record.photoOutUrl)} className="w-full h-full object-cover transform scale-x-[-1]" alt="Check Out" onError={(e) => { e.target.style.display = 'none'; e.target.parentElement.innerHTML = '<i class="fa-solid fa-image text-gray-300 text-2xl"></i>'; }} />
                                    </div>
                                </div>
                            ) : <div className="flex-1 flex flex-col items-center justify-center border border-dashed border-gray-200 rounded-xl bg-white"><i className="fa-regular fa-image text-gray-300 text-2xl"></i></div>}
                        </div>
                        <div className="p-5 border-t border-gray-100 text-base shrink-0 bg-white">
                            <p className="font-semibold text-gray-900">{emp.fname} {emp.lname} <span className="font-normal text-gray-500 text-sm ml-1">({record.empId})</span></p>
                            <p className="text-sm mt-1 text-gray-600">วันที่: {formatDisplayDate(record.date)}</p>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [currentUser, setCurrentUser] = useState(null); 
            const [activeTab, setActiveTab] = useState('home'); 
            const [avatarImgError, setAvatarImgError] = useState(false); 
            
            const [currentTime, setCurrentTime] = useState(new Date());
            const [records, setRecords] = useState([]);
            const [employees, setEmployees] = useState({});
            const [schedules, setSchedules] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [settings, setSettings] = useState({ standardWorkDays: {} });

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const fetchInitialData = async () => {
                    if (GAS_URL.includes("ใส่_URL")) {
                        setIsLoading(false); return;
                    }
                    const res = await sendToGoogleSheet('getInitialData');
                    if (res && res.status === 'success') {
                        setEmployees(res.data.employees || {});
                        setRecords(res.data.records || []);
                        setSchedules(res.data.schedules || {});
                        if (res.data.settings) setSettings(res.data.settings);
                    }
                    setIsLoading(false);
                };
                fetchInitialData();
            }, []);

            const formatDateForInput = (date) => {
                const d = new Date(date);
                const month = '' + (d.getMonth() + 1);
                const day = '' + d.getDate();
                const year = d.getFullYear();
                return [year, month.padStart(2, '0'), day.padStart(2, '0')].join('-');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('home');
                setAvatarImgError(false);
            };

            if (isLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
                    <div className="w-10 h-10 border-4 border-gray-200 border-t-primary rounded-full animate-spin mb-4"></div>
                    <h2 className="text-gray-600 font-medium">กำลังโหลดข้อมูล...</h2>
                </div>
            );

            if (!currentUser && activeTab === 'register') {
                return <RegisterView employees={employees} setEmployees={setEmployees} onCancel={() => setActiveTab('home')} sendToGoogleSheet={sendToGoogleSheet} />;
            }

            if (!currentUser) {
                return <UnifiedLoginView employees={employees} onLogin={(user) => { setCurrentUser(user); setAvatarImgError(false); }} onRegisterClick={() => setActiveTab('register')} />;
            }

            const isManager = currentUser.level === 'หัวหน้า' || currentUser.dept === 'ADMIN';
            const role = currentUser.dept === 'ADMIN' ? 'admin' : (currentUser.level === 'หัวหน้า' ? 'supervisor' : 'employee');
            
            const getDriveImageUrl = (url) => {
                if (!url) return null;
                const match = url.match(/[-\w]{25,}/);
                if (match && match[0]) return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w400-h400`;
                return url;
            };
            
            const latestRecordWithPhoto = records.filter(r => r.empId === currentUser.id && r.photoInUrl).sort((a,b) => b.id.localeCompare(a.id))[0];
            const defaultAvatarUrl = `https://ui-avatars.com/api/?name=${currentUser.fname}+${currentUser.lname}&background=f3f4f6&color=374151&size=150`;
            const avatarUrl = (latestRecordWithPhoto && !avatarImgError) ? getDriveImageUrl(latestRecordWithPhoto.photoInUrl) : defaultAvatarUrl;

            return (
                <div className="min-h-screen flex flex-col bg-gray-50 pb-20 font-sans text-gray-900">
                    
                    {/* Enterprise Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-40 print-hide shadow-subtle">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full border border-gray-200 overflow-hidden bg-gray-50 shrink-0">
                                        <img src={avatarUrl} alt="Profile" className="w-full h-full object-cover transform scale-x-[-1]" onError={() => setAvatarImgError(true)} />
                                    </div>
                                    <div className="flex flex-col justify-center">
                                        <h2 className="text-sm font-semibold leading-tight">{currentUser.fname} {currentUser.lname}</h2>
                                        <p className="text-xs text-gray-500 leading-tight mt-0.5">{currentUser.dept} {isManager && <span className="ml-1 text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-md font-medium border border-gray-200">{role === 'admin' ? 'Admin' : 'Head'}</span>}</p>
                                    </div>
                                </div>
                                <button onClick={handleLogout} className="text-gray-500 hover:text-gray-900 text-sm font-medium transition-colors flex items-center gap-2">
                                    <span className="hidden sm:inline">ออกจากระบบ</span>
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow w-full max-w-7xl mx-auto z-10 px-4 sm:px-6 lg:px-8 py-6">
                        {activeTab === 'home' && <ActionPanelView currentUser={currentUser} currentTime={currentTime} records={records} setRecords={setRecords} schedules={schedules} formatDateForInput={formatDateForInput} sendToGoogleSheet={sendToGoogleSheet} />}
                        {activeTab === 'calendar' && <MyCalendarView currentUser={currentUser} schedules={schedules} />}
                        {activeTab === 'history' && <MyHistoryView currentUser={currentUser} records={records} formatDateForInput={formatDateForInput} currentTime={currentTime} />}
                        {activeTab === 'manager' && isManager && <ReportView role={role} user={currentUser} records={records} setRecords={setRecords} employees={employees} schedules={schedules} setSchedules={setSchedules} sendToGoogleSheet={sendToGoogleSheet} settings={settings} setSettings={setSettings} />}
                    </main>

        function ClockInModule({ currentUser, currentTime, records, setRecords, schedules, formatDateForInput, sendToGoogleSheet, onDone }) {
            const [selectedShift, setSelectedShift] = useState('');
            const [validShifts, setValidShifts] = useState([]);
            const [locationStatus, setLocationStatus] = useState('checking'); 
            const [currentLocation, setCurrentLocation] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [result, setResult] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const videoRef = useRef(null);

            const todayStrRaw = formatDateForInput(currentTime);
            let effectiveTargetDate = todayStrRaw;
            if (currentTime.getHours() >= 0 && currentTime.getHours() <= 3) {
                const yesterday = new Date(currentTime); yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = formatDateForInput(yesterday);
                const yestObj = schedules[yesterdayStr]?.[currentUser.id];
                const yesterdayShifts = yestObj?.shifts || (Array.isArray(yestObj) ? yestObj : []);
                if (yesterdayShifts.includes(selectedShift)) {
                    effectiveTargetDate = yesterdayStr; 
                }
            }
            const isAlreadyClockedIn = selectedShift ? records.some(r => r.empId === currentUser.id && r.date === effectiveTargetDate && r.shiftId === selectedShift) : false;

            useEffect(() => {
                initializeSetup();
            }, []);

            useEffect(() => {
                if (cameraActive && !result && locationStatus === 'ok') {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                        .then(stream => { if (videoRef.current) videoRef.current.srcObject = stream; })
                        .catch(() => { setErrorMsg("ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบการอนุญาต"); setCameraActive(false); });
                } else {
                    const stream = videoRef.current?.srcObject;
                    if (stream) stream.getTracks().forEach(track => track.stop());
                }
                return () => {
                     const stream = videoRef.current?.srcObject;
                     if (stream) stream.getTracks().forEach(track => track.stop());
                }
            }, [cameraActive, result, locationStatus]);

            const getDistance = (lat1, lon1, lat2, lon2) => {
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c * 1000; 
            };

            const checkLocation = () => {
                setLocationStatus('checking');
                setErrorMsg('');
                
                if (!navigator.geolocation) { 
                    setErrorMsg("เบราว์เซอร์ไม่รองรับ GPS"); 
                    setLocationStatus('error'); 
                    return; 
                }

                const fallbackTimeout = setTimeout(() => {
                    setErrorMsg("GPS ไม่ตอบสนอง ลองสลับเน็ตหรือรีเฟรชหน้าเว็บ");
                    setLocationStatus('error');
                }, 15000);

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(fallbackTimeout);
                        const lat = position.coords.latitude; 
                        const lon = position.coords.longitude;
                        setCurrentLocation({ lat, lon });
                        const dist = getDistance(lat, lon, HOSPITAL_LAT, HOSPITAL_LON);
                        
                        if (dist <= ALLOWED_RADIUS) {
                            setLocationStatus('ok');
                            setErrorMsg('');
                        } else { 
                            setErrorMsg(`อยู่นอกพื้นที่ (${Math.round(dist)}ม.)`); 
                            setLocationStatus('error'); 
                        }
                    },
                    (err) => { 
                        clearTimeout(fallbackTimeout);
                        let msg = "ไม่สามารถระบุตำแหน่งได้";
                        if (err.code === 1) msg = "กรุณาอนุญาตการเข้าถึงตำแหน่ง (Location)";
                        if (err.code === 2) msg = "สัญญาณ GPS ขัดข้อง";
                        if (err.code === 3) msg = "หมดเวลาการค้นหาพิกัด";
                        setErrorMsg(msg); 
                        setLocationStatus('error'); 
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const initializeSetup = () => {
                const todayStr = formatDateForInput(currentTime);
                const activeRecord = records.find(r => r.empId === currentUser.id && (r.date === todayStr || (currentTime.getHours() <= 8 && r.date === formatDateForInput(new Date(currentTime.getTime() - 86400000)))) && !r.timeOut);
                
                if (activeRecord) { 
                    setErrorMsg(`ค้างลงเวลาออกกะ "${SHIFT_TYPES[activeRecord.shiftId]?.label || activeRecord.shiftId}"`); 
                    setLocationStatus('error'); 
                    return; 
                }

                let targetDate = todayStr; 
                const schedObjToday = schedules[todayStr]?.[currentUser.id];
                let scheduledShifts = schedObjToday?.shifts || (Array.isArray(schedObjToday) ? schedObjToday : []);
                
                if (currentTime.getHours() >= 0 && currentTime.getHours() <= 3) {
                    const yesterday = new Date(currentTime);
                    yesterday.setDate(yesterday.getDate() - 1);
                    const yesterdayStr = formatDateForInput(yesterday);
                    
                    const yestObj = schedules[yesterdayStr]?.[currentUser.id];
                    const yesterdayShifts = yestObj?.shifts || (Array.isArray(yestObj) ? yestObj : []);
                    if (yesterdayShifts.length > 0) {
                        scheduledShifts = yesterdayShifts;
                        targetDate = yesterdayStr;
                    }
                }

                const completedShifts = records
                    .filter(r => r.empId === currentUser.id && r.date === targetDate)
                    .map(r => r.shiftId);

                const validScheduledShifts = scheduledShifts.filter(s => 
                    s && 
                    !['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].includes(s) &&
                    !completedShifts.includes(s) 
                );

                setValidShifts(validScheduledShifts);

                if(validScheduledShifts.length > 0) { 
                    setSelectedShift(validScheduledShifts[0]); 
                    checkLocation(); 
                } else {
                    setSelectedShift('');
                    if (scheduledShifts.length > 0 && completedShifts.length > 0) {
                        setErrorMsg('ลงเวลาครบทุกกะของวันนี้แล้ว');
                    } else {
                        setErrorMsg('ไม่พบตารางเวรของคุณในระบบ');
                    }
                    setLocationStatus('error');
                }
            };

            const handleClockIn = async () => {
                if (isAlreadyClockedIn) {
                    setErrorMsg(`ไม่อนุญาต: คุณได้ลงเวลาสำหรับกะนี้ไปแล้ว`);
                    setIsScanning(false); setCameraActive(false); return; 
                }

                setErrorMsg(''); setIsScanning(true);
                const todayStr = formatDateForInput(currentTime);
                let targetDate = todayStr; 
                
                const schedObjToday = schedules[todayStr]?.[currentUser.id];
                let scheduledShifts = schedObjToday?.shifts || (Array.isArray(schedObjToday) ? schedObjToday : []);
                
                if (currentTime.getHours() >= 0 && currentTime.getHours() <= 3) {
                    const yesterday = new Date(currentTime); yesterday.setDate(yesterday.getDate() - 1);
                    const yesterdayStr = formatDateForInput(yesterday);
                    const yestObj = schedules[yesterdayStr]?.[currentUser.id];
                    const yesterdayShifts = yestObj?.shifts || (Array.isArray(yestObj) ? yestObj : []);
                    
                    if (yesterdayShifts.includes(selectedShift)) {
                        scheduledShifts = yesterdayShifts; targetDate = yesterdayStr; 
                    }
                }
                
                const photoBase64 = captureImage(videoRef.current);
                if (!photoBase64) {
                    setErrorMsg(`จับภาพล้มเหลว รอให้กล้องชัดเจนก่อนกดสแกน`); 
                    setIsScanning(false); 
                    return; 
                }

                const shiftData = SHIFT_TYPES[selectedShift];
                const [shiftHour, shiftMinute] = shiftData.start.split(':').map(Number);
                const actualMins = currentTime.getHours() * 60 + currentTime.getMinutes();
                const deadlineMins = (shiftHour * 60) + shiftMinute + 5; 
                const isLate = actualMins > deadlineMins && actualMins < deadlineMins + 720; 
                const lateMinutes = isLate ? (actualMins - deadlineMins) : 0;
                const timeInStr = formatTime24(currentTime);

                const newRecord = {
                    id: Date.now().toString(), date: targetDate, empId: currentUser.id, shiftId: selectedShift, 
                    timeIn: timeInStr, timeOut: null, isLate: isLate, lateMinutes: lateMinutes, credit: shiftData.credit,
                    lat: currentLocation?.lat, lon: currentLocation?.lon, photoBase64: photoBase64
                };

                const res = await sendToGoogleSheet('clockIn', newRecord, 3);
                if (res && res.status === 'success') {
                    setRecords([...records, newRecord]);
                    setResult({ ...newRecord, shiftName: shiftData.label }); 
                } else if (res && res.status === 'error') {
                    Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: '#111827' });
                }
                setIsScanning(false); setCameraActive(false);
            };

            if (result) return (
                <div className="bg-white rounded-2xl p-8 shadow-soft border border-gray-100 text-center animate-fade-in">
                    <div className="w-16 h-16 bg-gray-50 text-gray-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-200"><i className="fa-solid fa-check text-2xl"></i></div>
                    <h2 className="text-xl font-semibold text-gray-900">บันทึกเข้างานสำเร็จ</h2>

        function ClockOutModule({ currentUser, currentTime, records, setRecords, formatDateForInput, sendToGoogleSheet, onDone }) {
            const [outDate, setOutDate] = useState(formatDateForInput(currentTime));
            const [foundRecord, setFoundRecord] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [cameraActive, setCameraActive] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [showEarlyWarning, setShowEarlyWarning] = useState(false);
            const [successResult, setSuccessResult] = useState(null);
            const videoRef = useRef(null);

            useEffect(() => { searchRecord(outDate); }, []);

            useEffect(() => {
                if (cameraActive && !successResult) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(stream => { if (videoRef.current) videoRef.current.srcObject = stream; }).catch(() => { setErrorMsg("ไม่สามารถเข้าถึงกล้องได้"); setCameraActive(false); });
                } else {
                    const stream = videoRef.current?.srcObject;
                    if (stream) stream.getTracks().forEach(track => track.stop());
                }
                return () => {
                     const stream = videoRef.current?.srcObject;
                     if (stream) stream.getTracks().forEach(track => track.stop());
                }
            }, [cameraActive, successResult]);

            const searchRecord = (searchDate) => {
                setErrorMsg(''); setFoundRecord(null); setCameraActive(false);
                const record = records.find(r => r.empId === currentUser.id && r.date === searchDate && !r.timeOut);
                if (!record) { setErrorMsg(`ไม่พบประวัติค้างออกของวันที่เลือก`); return; }
                setFoundRecord(record);
            };

            const handleDateChange = (e) => { const newDate = e.target.value; setOutDate(newDate); searchRecord(newDate); };

            const handleClockOutAttempt = () => {
                if (!cameraActive) return;
                const shiftData = SHIFT_TYPES[foundRecord.shiftId];
                let shiftEndStr = shiftData.end === '24:00' ? '23:59' : shiftData.end;
                const [endH, endM] = shiftEndStr.split(':').map(Number);
                const [startH, startM] = shiftData.start.split(':').map(Number);
                
                const endTime = new Date(currentTime); 
                endTime.setHours(endH, endM, 0, 0);
                if (endH < startH) if (currentTime.getHours() >= 12) endTime.setDate(endTime.getDate() + 1);

                if (currentTime < endTime) setShowEarlyWarning(true);
                else processClockOut();
            };

            const processClockOut = async () => {
                setShowEarlyWarning(false); setIsScanning(true); setErrorMsg('');
                const photoBase64 = captureImage(videoRef.current);
                if (!photoBase64) { setIsScanning(false); return; }

                const timeOutStr = formatTime24(currentTime);
                const res = await sendToGoogleSheet('clockOut', { id: foundRecord.id, timeOut: timeOutStr, photoBase64: photoBase64 }, 3);
                if (res && res.status === 'success') {
                    setRecords(records.map(r => r.id === foundRecord.id ? { ...r, timeOut: timeOutStr } : r));
                    setSuccessResult({ timeOut: timeOutStr, shiftName: SHIFT_TYPES[foundRecord.shiftId]?.label });
                } else if (res && res.status === 'error') {
                    Swal.fire({ icon: 'error', text: res.message, confirmButtonColor: '#111827' });
                }
                setIsScanning(false); setCameraActive(false);
            };

            if (successResult) return (
                <div className="bg-white rounded-2xl p-8 shadow-soft border border-gray-100 text-center animate-fade-in">
                    <div className="w-16 h-16 bg-gray-50 text-gray-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-200"><i className="fa-solid fa-arrow-right-from-bracket text-2xl"></i></div>
                    <h2 className="text-xl font-semibold text-gray-900">บันทึกออกงานสำเร็จ</h2>
                    <div className="my-6">
                        <p className="text-4xl font-light text-gray-900 mb-2">{displaySafeTime(successResult.timeOut)}</p>
                        <p className="text-sm font-medium text-gray-500 bg-gray-50 inline-block px-3 py-1 rounded-md border border-gray-100">{successResult.shiftName}</p>
                    </div>
                    <button onClick={onDone} className="w-full p-3.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-medium transition-colors">เสร็จสิ้น</button>
                </div>
            );

            return (
                <div className="bg-white rounded-2xl shadow-soft border border-gray-100 overflow-hidden animate-fade-in">
                    <div className="px-6 py-5 border-b border-gray-100 flex items-center gap-3">
                        <div className="w-8 h-8 rounded-full bg-gray-50 text-gray-700 flex items-center justify-center"><i className="fa-solid fa-arrow-right-from-bracket text-sm"></i></div>
                        <h2 className="text-lg font-semibold text-gray-900">ออกงาน</h2>
                    </div>
                    <div className="p-6 space-y-5">
                        {errorMsg && <div className="p-3 bg-red-50 text-red-600 rounded-lg text-sm flex items-start gap-2 border border-red-100"><i className="fa-solid fa-circle-exclamation mt-0.5"></i> <span>{errorMsg}</span></div>}
                        
                        <div>
                            <label className="block text-xs font-medium text-gray-500 mb-1.5 uppercase tracking-wider">วันที่เข้างาน</label>
                            <input type="date" value={outDate} onChange={handleDateChange} className="w-full p-3.5 border border-gray-300 rounded-xl bg-white outline-none font-medium text-gray-900 focus:border-primary" />
                        </div>

                        {!foundRecord ? (
                            <div className="text-center py-8 bg-gray-50 rounded-xl border border-gray-100 text-gray-400 text-sm">ไม่พบประวัติเข้างานของวันที่เลือก</div>
                        ) : (
                            <div className="space-y-5 animate-in fade-in">
                                <div className="bg-gray-50 border border-gray-200 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">กะที่บันทึก</p>
                                        <p className="font-medium text-gray-900 mt-0.5 text-sm">{SHIFT_TYPES[foundRecord.shiftId]?.label}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">เข้าเมื่อ</p>
                                        <p className="font-medium text-gray-900 mt-0.5 text-sm">{displaySafeTime(foundRecord.timeIn)}</p>
                                    </div>
                                </div>

                                <div className="border border-gray-200 rounded-xl h-64 flex items-center justify-center bg-gray-50 overflow-hidden relative">
                                    {cameraActive ? <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover transform scale-x-[-1]" /> : 
                                    <button onClick={() => setCameraActive(true)} className="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-colors">
                                        <i className="fa-solid fa-camera text-3xl mb-2"></i>
                                        <span className="text-sm font-medium">เปิดกล้องสแกนหน้า</span>
                                    </button>}
                                </div>

                                {showEarlyWarning ? (
                                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-100 text-center">
                                        <p className="text-amber-800 mb-3 text-sm font-medium">ออกก่อนเวลาเลิกกะ ยืนยันหรือไม่?</p>
                                        <div className="flex gap-2">
                                            <button onClick={processClockOut} className="flex-1 bg-amber-600 text-white rounded-lg py-2.5 text-sm font-medium">ยืนยัน</button>
                                            <button onClick={() => setShowEarlyWarning(false)} className="flex-1 bg-white border border-gray-200 text-gray-700 rounded-lg py-2.5 text-sm font-medium">ยกเลิก</button>
                                        </div>
                                    </div>
                                ) : (
                                    <button onClick={handleClockOutAttempt} disabled={!cameraActive || isScanning} className={`w-full p-3.5 rounded-xl font-medium text-base text-white transition-all ${cameraActive ? 'bg-gray-900 hover:bg-black' : 'bg-gray-300 cursor-not-allowed'}`}>
                                        {isScanning ? 'กำลังบันทึก...' : 'สแกนหน้า ยืนยันออกงาน'}
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ReportView({ role, user, records, setRecords, employees, schedules, setSchedules, sendToGoogleSheet, settings, setSettings }) {
            const [adminTab, setAdminTab] = useState(role === 'supervisor' ? 'summary' : 'logs'); 
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const now = new Date();
            const defaultMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const [matrixMonth, setMatrixMonth] = useState(defaultMonth);
            const [filterDept, setFilterDept] = useState(role === 'supervisor' ? user.dept : '');
            const [filterEmp, setFilterEmp] = useState('');
            
            const [localWorkDays, setLocalWorkDays] = useState(22);
            useEffect(() => { setLocalWorkDays(parseInt(settings?.standardWorkDays?.[matrixMonth]) || 22); }, [settings, matrixMonth]);
            
            const [selectedMapRecord, setSelectedMapRecord] = useState(null);
            const [selectedPhotoRecord, setSelectedPhotoRecord] = useState(null);
            const [editModalData, setEditModalData] = useState(null);
            const [addModalData, setAddModalData] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [scheduleModalData, setScheduleModalData] = useState(null);
            const [autoScheduleModal, setAutoScheduleModal] = useState(false);
            const [autoScheduleData, setAutoScheduleData] = useState({ empId: 'all', shiftId: '', dayPattern: 'all', overwrite: false, assignMode: 'all', requiredCount: 1 });

            const filteredRecords = records.filter(r => {
                const emp = employees[r.empId];
                if (!emp) return false;
                if (startDate && r.date < startDate) return false;
                if (endDate && r.date > endDate) return false;
                if (filterDept && emp.dept !== filterDept) return false;
                if (filterEmp) {
                    const search = filterEmp.toLowerCase();
                    if (!r.empId.toLowerCase().includes(search) && !`${emp.fname} ${emp.lname}`.toLowerCase().includes(search)) return false;
                }
                return true;
            });

            const totalLateMinutes = filteredRecords.reduce((sum, r) => sum + (r.isLate ? (Number(r.lateMinutes) || 0) : 0), 0);
            const matrixYear = parseInt(matrixMonth.split('-')[0], 10);
            const matrixMonthNum = parseInt(matrixMonth.split('-')[1], 10);
            const daysInMonth = new Date(matrixYear, matrixMonthNum, 0).getDate();
            const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

            const matrixEmployees = Object.keys(employees).filter(id => {
                const emp = employees[id];
                if (filterDept && emp.dept !== filterDept) return false;
                if (filterEmp) {
                    const search = filterEmp.toLowerCase();
                    if (!id.toLowerCase().includes(search) && !`${emp.fname} ${emp.lname}`.toLowerCase().includes(search)) return false;
                }
                return true;
            });

            const summaryMatrix = matrixEmployees.map(empId => {
                const empRecords = records.filter(r => r.empId === empId && r.date.startsWith(matrixMonth));
                const shiftsByDay = {};
                const shiftCounts = {};
                let empTotalCredit = 0, empTotalLate = 0;
                const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                daysArray.forEach(day => {
                    const dateStr = `${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayRecords = empRecords.filter(r => r.date === dateStr);
                    const schedObj = schedules[dateStr]?.[empId];
                    const scheduledShifts = schedObj?.shifts || [];

                    let shiftDisplay = '-', isAbsent = false, uiElements = []; 

                    if (adminTab === 'schedules') {
                        if (scheduledShifts.length > 0) {
                            shiftDisplay = scheduledShifts.join(', ');
                            scheduledShifts.forEach(s => {
                                if (s) shiftCounts[s] = (shiftCounts[s] || 0) + 1;
                                if (SHIFT_TYPES[s]) empTotalCredit += SHIFT_TYPES[s].credit;
                                else if (['Vac', 'พักร้อน', 'ป่วย', 'ลา'].includes(s)) empTotalCredit += 1;
                            });
                        }
                        shiftsByDay[day] = { display: shiftDisplay, isAbsent: false, uiElements: [] };
                    } else {
                        const workedShifts = dayRecords.map(r => r.shiftId).filter(Boolean);
                        const pendingShifts = scheduledShifts.filter(s => s && !workedShifts.includes(s));
                        let displayArr = [];

                        workedShifts.forEach(s => { shiftCounts[s] = (shiftCounts[s] || 0) + 1; displayArr.push(s); uiElements.push({ shift: s, type: 'worked' }); });
                        empTotalCredit += dayRecords.reduce((sum, r) => sum + (r.credit || 0), 0);
                        empTotalLate += dayRecords.reduce((sum, r) => sum + (r.isLate ? Number(r.lateMinutes) : 0), 0);

                        if (dateStr < todayStr) {
                            pendingShifts.forEach(s => {
                                if (['Vac', 'พักร้อน', 'ป่วย', 'ลา', 'Off'].includes(s)) {
                                    shiftCounts[s] = (shiftCounts[s] || 0) + 1;
                                    if (['Vac', 'พักร้อน', 'ป่วย', 'ลา'].includes(s)) empTotalCredit += 1;
                                    displayArr.push(s); uiElements.push({ shift: s, type: 'leave' });
                                } else {
                                    shiftCounts['ขาด'] = (shiftCounts['ขาด'] || 0) + 1;
                                    isAbsent = true; displayArr.push(`${s} (ขาด)`); uiElements.push({ shift: s, type: 'absent' });
                                }
                            });
                        } else {
                            pendingShifts.forEach(s => {
                                shiftCounts[s] = (shiftCounts[s] || 0) + 1;
                                if (SHIFT_TYPES[s]) empTotalCredit += SHIFT_TYPES[s].credit;
                                else if (['Vac', 'พักร้อน', 'ป่วย', 'ลา'].includes(s)) empTotalCredit += 1;
                                displayArr.push(s); uiElements.push({ shift: s, type: 'pending' });
                            });
                        }
                        shiftsByDay[day] = { display: displayArr.join(', ') || '-', isAbsent, uiElements };
                    }
                });
                return { empId, fname: employees[empId].fname, lname: employees[empId].lname, dept: employees[empId].dept, level: employees[empId].level, shiftsByDay, empTotalCredit, empTotalLate, otShifts: empTotalCredit - localWorkDays, shiftCounts };
            });

            const getDailyShiftCounts = (day) => {
                const counts = {};
                summaryMatrix.forEach(row => {
                    if (adminTab === 'schedules') {
                        const shifts = schedules[`${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`]?.[row.empId]?.shifts || [];
                        shifts.forEach(s => { if (s && !['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].includes(s)) counts[s] = (counts[s] || 0) + 1; });
                    } else if (adminTab === 'summary') {
                        (row.shiftsByDay[day]?.uiElements || []).forEach(el => {
                            if ((el.type === 'worked' || el.type === 'pending') && !['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].includes(el.shift)) counts[el.shift] = (counts[el.shift] || 0) + 1;
                        });
                    }
                });
                return counts;
            };

            const allShiftTypesUsed = new Set(); summaryMatrix.forEach(emp => Object.keys(emp.shiftCounts).forEach(type => allShiftTypesUsed.add(type)));
            const sortedShiftTypesUsed = Array.from(allShiftTypesUsed).sort((a, b) => {
                const nonWorkA = ['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].includes(a), nonWorkB = ['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].includes(b);
                if (!nonWorkA && nonWorkB) return -1; if (nonWorkA && !nonWorkB) return 1; return a.localeCompare(b);
            });

            const handleSaveSettings = async () => {
                const res = await sendToGoogleSheet('saveSettings', { standardWorkDays: localWorkDays, monthYear: matrixMonth });
                if(res?.status === 'success') { setSettings({...settings, standardWorkDays: { ...settings.standardWorkDays, [matrixMonth]: localWorkDays }}); Swal.fire({ icon: 'success', text: 'บันทึกวันทำการสำเร็จ', timer: 1500, showConfirmButton: false }); }
            };

            const handleSaveEdit = async () => {
                setIsSaving(true);
                const shiftData = SHIFT_TYPES[editModalData.shiftId];
                const res = await sendToGoogleSheet('editRecord', { id: editModalData.id, timeIn: editModalData.timeIn || '', timeOut: editModalData.timeOut || '', shiftId: editModalData.shiftId, credit: shiftData ? shiftData.credit : 0 });
                if (res?.status === 'success') { setRecords(records.map(r => r.id === editModalData.id ? { ...r, timeIn: editModalData.timeIn, timeOut: editModalData.timeOut, shiftId: editModalData.shiftId, credit: shiftData?.credit || 0 } : r)); setEditModalData(null); }
                setIsSaving(false);

            const handleSaveAdd = async () => {
                const upperEmp = addModalData.empId.trim().toUpperCase();
                if(!employees[upperEmp]) return Swal.fire({icon:'warning', text:'ไม่พบรหัสพนักงานนี้'});
                setIsSaving(true);
                const newRecord = { id: Date.now().toString(), date: addModalData.date, empId: upperEmp, shiftId: addModalData.shiftId, timeIn: addModalData.timeIn, timeOut: addModalData.timeOut || '', isLate: false, lateMinutes: 0, credit: SHIFT_TYPES[addModalData.shiftId]?.credit || 0, lat: null, lon: null, photoBase64: null };
                const res = await sendToGoogleSheet('adminAddRecord', newRecord);
                if(res?.status === 'success') { setRecords([...records, newRecord]); setAddModalData(null); }
                setIsSaving(false);
            };

            const handleDelete = async (id) => {
                const confirm = await Swal.fire({ text: "ยืนยันการลบ?", showCancelButton: true, confirmButtonColor: '#111827', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' });
                if (confirm.isConfirmed) { const res = await sendToGoogleSheet('deleteRecord', { id }); if (res?.status === 'success') setRecords(records.filter(r => r.id !== id)); }
            };

            const handleRunAutoSchedule = async () => {
                setIsSaving(true);
                const targetEmps = autoScheduleData.empId === 'all' ? matrixEmployees : [autoScheduleData.empId];
                const isQuotaMode = autoScheduleData.assignMode === 'quota';
                const reqCount = autoScheduleData.requiredCount || 1;
                const updates = []; const newSchedules = { ...schedules }; const assignedCounts = {};
                
                if (isQuotaMode) targetEmps.forEach(empId => { assignedCounts[empId] = 0; daysArray.forEach(day => { if ((newSchedules[`${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`]?.[empId]?.shifts || []).includes(autoScheduleData.shiftId)) assignedCounts[empId]++; }); });
                
                daysArray.forEach(day => {
                    const dateStr = `${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayOfWeek = new Date(matrixYear, matrixMonthNum - 1, day).getDay(); 
                    if (autoScheduleData.dayPattern === 'all' || (autoScheduleData.dayPattern === 'weekdays' && dayOfWeek >= 1 && dayOfWeek <= 5) || (autoScheduleData.dayPattern === 'weekends' && (dayOfWeek === 0 || dayOfWeek === 6))) {
                        let eligible = targetEmps.filter(empId => { const s = newSchedules[dateStr]?.[empId]?.shifts || []; return (s.length === 0 || s[0] === '' || autoScheduleData.overwrite) && !(isQuotaMode && s.includes(autoScheduleData.shiftId)); });
                        if (isQuotaMode) { eligible.sort((a, b) => assignedCounts[a] - assignedCounts[b] || Math.random() - 0.5); eligible = eligible.slice(0, reqCount); }
                        eligible.forEach(empId => {
                            if (!newSchedules[dateStr]) newSchedules[dateStr] = {};
                            newSchedules[dateStr][empId] = { shifts: [autoScheduleData.shiftId], isEdited: true, editedBy: user.id };
                            updates.push({ date: dateStr, empId, shifts: [autoScheduleData.shiftId] });
                            if (isQuotaMode) assignedCounts[empId]++;
                        });
                    }
                });
                
                if (updates.length > 0) {
                    setSchedules(newSchedules); setAutoScheduleModal(false);
                    const res = await sendToGoogleSheet('saveScheduleBulk', { updates, editorId: user.id, editorName: `${user.fname} ${user.lname}` });

                    {selectedMapRecord && <MapModal lat={selectedMapRecord.lat} lon={selectedMapRecord.lon} onClose={() => setSelectedMapRecord(null)} />}

                    {editModalData && (
                        <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 print-hide animate-fade-in">

                                <h3 className="font-semibold text-gray-900 mb-4">แก้ไขประวัติ</h3>
                                <div className="space-y-4 text-sm">
                                    <select value={editModalData.shiftId} onChange={e => setEditModalData({...editModalData, shiftId: e.target.value})} className="w-full p-2.5 rounded-lg border border-gray-300">
                                        {getSortedShiftKeys(employees[editModalData.empId]?.dept).map(k => <option key={k} value={k}>{SHIFT_TYPES[k].label}</option>)}
                                    </select>
                                    <div className="flex gap-2">
                                        <input type="time" value={editModalData.timeIn} onChange={e => setEditModalData({...editModalData, timeIn: e.target.value})} className="w-full p-2.5 rounded-lg border border-gray-300" />
                                        <input type="time" value={editModalData.timeOut || ''} onChange={e => setEditModalData({...editModalData, timeOut: e.target.value})} className="w-full p-2.5 rounded-lg border border-gray-300" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => setEditModalData(null)} className="flex-1 p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium">ยกเลิก</button>
                                        <button onClick={handleSaveEdit} className="flex-1 p-2.5 bg-gray-900 hover:bg-black text-white rounded-lg font-medium">บันทึก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {scheduleModalData && (
                        <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 print-hide animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-soft overflow-hidden p-6">
                                <h3 className="font-semibold text-gray-900 mb-1">จัดการเวร <span className="text-gray-500 font-normal text-sm ml-2">{formatDisplayDate(scheduleModalData.dateStr)}</span></h3>
                                <p className="text-xs text-gray-500 mb-4">{employees[scheduleModalData.empId]?.fname}</p>
                                <div className="space-y-2 max-h-48 overflow-y-auto mb-4">
                                    {scheduleModalData.shifts.map((shift, i) => (
                                        <div key={i} className="flex gap-2">
                                            <select value={shift} onChange={e => {const s=[...scheduleModalData.shifts]; s[i]=e.target.value; setScheduleModalData({...scheduleModalData, shifts: s})}} className="flex-1 p-2 border border-gray-200 rounded-lg text-sm bg-gray-50">
                                                <option value="">- ว่าง -</option>

                                                <optgroup label="อื่นๆ">{['Off', 'Vac', 'พักร้อน', 'ลา', 'ป่วย', 'ขาด'].map(k => <option key={k} value={k}>{k}</option>)}</optgroup>
                                            </select>
                                            <button onClick={() => {const s=[...scheduleModalData.shifts]; s.splice(i,1); setScheduleModalData({...scheduleModalData, shifts: s})}} className="w-9 h-9 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center"><i className="fa-solid fa-trash-can"></i></button>

                                <div className="flex gap-2">

                                </div>

                    {autoScheduleModal && (

                                                <td className="px-4 py-3 text-center">{displaySafeTime(r.timeOut)}</td>
                                                <td className="px-4 py-3 text-center">{r.isLate ? <span className="text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded text-xs">{r.lateMinutes} น.</span> : '-'}</td>
                                                <td className="px-4 py-3 text-center print-hide">{(r.photoInUrl||r.photoOutUrl)?<button onClick={()=>setSelectedPhotoRecord(r)} className="text-gray-400 hover:text-gray-900"><i className="fa-solid fa-image"></i></button>:'-'}</td>
                                                <td className="px-4 py-3 text-right print-hide"><button onClick={()=>setEditModalData({...r})} className="text-gray-400 hover:text-gray-900 mr-3"><i className="fa-solid fa-pen"></i></button><button onClick={()=>handleDelete(r.id)} className="text-gray-400 hover:text-red-500"><i className="fa-solid fa-trash"></i></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {(adminTab === 'summary' || adminTab === 'schedules') && filterDept && (
                        <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm print-table-wrapper">
                            <div className="overflow-x-auto">
                                <table className="min-w-full text-left">
                                    <thead className="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th rowSpan="2" className="px-4 py-3 font-semibold text-gray-900 text-sm sticky left-0 bg-gray-50 z-20 border-r border-gray-200">พนักงาน</th>
                                            {daysArray.map(day => {
                                                const isWeekend = [0, 6].includes(new Date(matrixYear, matrixMonthNum - 1, day).getDay());
                                                return <th key={day} rowSpan="2" className={`px-1 py-3 text-center text-xs font-semibold min-w-[32px] ${isWeekend ? 'text-rose-500' : 'text-gray-500'}`}>{day}</th>
                                            })}
                                            <th rowSpan="2" className="px-3 py-3 text-center text-xs font-semibold text-gray-700 bg-gray-100/50 border-l border-gray-200">รวม</th>
                                            {adminTab === 'summary' && <th rowSpan="2" className="px-3 py-3 text-center text-xs font-semibold text-gray-900 bg-gray-100/50 border-l border-gray-200">OT</th>}
                                        </tr>
                                        <tr>{/* Spacing row */}</tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 text-sm">
                                        {summaryMatrix.map(row => (
                                            <tr key={row.empId} className="hover:bg-gray-50/50">
                                                <td className="px-4 py-2 sticky left-0 bg-white z-10 border-r border-gray-200">
                                                    <p className="font-medium text-gray-900 leading-tight">{row.fname}</p>
                                                    <p className="text-[10px] text-gray-400">{row.level}</p>
                                                </td>
                                                {daysArray.map(day => {
                                                    const isWeekend = [0, 6].includes(new Date(matrixYear, matrixMonthNum - 1, day).getDay());
                                                    
                                                    if(adminTab === 'schedules') {
                                                        const dateStr = `${matrixYear}-${String(matrixMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                                        const schedObj = schedules[dateStr]?.[row.empId];
                                                        const shifts = schedObj?.shifts || [];
                                                        const isEdited = schedObj?.isEdited;
                                                        return (
                                                            <td key={day} onClick={()=>openScheduleModal(row.empId, dateStr)} className={`px-0.5 py-2 text-center cursor-pointer border-r border-gray-50 hover:bg-gray-100 transition-colors relative ${isWeekend?'bg-rose-50/20':''}`}>
                                                                {isEdited && <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-400 rounded-full print-hide"></div>}
                                                                <div className="flex flex-col gap-0.5 items-center">
                                                                    {shifts.map((s,i) => <span key={i} className="shift-chip bg-white text-slate-800 border border-slate-300 px-1.5 py-0.5 rounded shadow-sm text-sm font-bold">{s}</span>)}
                                                                </div>
                                                            </td>
                                                        );
                                                    } else {
                                                        const el = row.shiftsByDay[day].uiElements;
                                                        const shiftObj = row.shiftsByDay[day];
                                                        const isAbsentDay = shiftObj.isAbsent;
                                                        const isEmpty = el.length === 0;

                                                        return (
                                                            <td key={day} className={`px-0.5 py-1.5 text-center text-xs font-bold border-r border-slate-50 align-middle ${isAbsentDay ? 'bg-red-50 ring-1 ring-inset ring-red-200' : (isEmpty ? '' : 'bg-slate-50/30')} ${isWeekend && isEmpty ? 'bg-rose-50/20' : ''}`}>
                                                                {isEmpty ? <span className="text-slate-300">-</span> : (
                                                                    <div className="flex flex-col gap-0.5 items-center justify-center my-0.5">
                                                                        {el.map((e,i) => {
                                                                            let chipClass = "shift-chip text-sm font-bold px-1.5 py-0.5 rounded border ";
                                                                            if (e.type === 'worked') chipClass += "text-blue-900 bg-blue-100 border-blue-300";
                                                                            else if (e.type === 'pending') chipClass += "text-emerald-900 bg-emerald-50 border-emerald-200";
                                                                            else if (e.type === 'absent') chipClass += "text-red-900 bg-red-100 border-red-300";
                                                                            else if (e.type === 'leave') chipClass += "text-amber-900 bg-amber-50 border-amber-300";
                                                                            
                                                                            return <span key={i} className={chipClass} title={e.type === 'pending' ? 'กะล่วงหน้า/รอสแกน' : ''}>{e.shift}</span>;
                                                                        })}
                                                                    </div>
                                                                )}
                                                            </td>
                                                        )
                                                    }
                                                })}
                                                <td className="px-3 py-2 text-center font-semibold text-gray-800 bg-gray-50/50 border-l border-gray-200">{row.empTotalCredit}</td>
                                                {adminTab === 'summary' && <td className="px-3 py-2 text-center font-semibold text-gray-900 bg-gray-50/50 border-l border-gray-200">{row.otShifts>0?`+${row.otShifts}`:row.otShifts}</td>}
                                            </tr>
                                        ))}
                                        
                                        {/* แถวสรุปอัตรากำลัง/วัน (ย้ายมาไว้ล่างสุด) */}
                                        {summaryMatrix.length > 0 && (
                                            <tr className="bg-amber-50/50 border-t-2 border-amber-200">
                                                <td className="px-4 py-3 sticky left-0 bg-amber-50 z-10 border-r border-slate-200 font-extrabold text-slate-800 text-right text-sm">
                                                    สรุปอัตรากำลัง/วัน
                                                </td>
                                                {daysArray.map(day => {
                                                    const counts = getDailyShiftCounts(day);
                                                    const isWeekend = [0, 6].includes(new Date(matrixYear, matrixMonthNum - 1, day).getDay());
                                                    return (
                                                        <td key={`sum-${day}`} className={`px-0.5 py-1 text-center border-r border-slate-200 align-top ${isWeekend ? 'bg-rose-50/30' : ''}`}>
                                                            {Object.keys(counts).length > 0 ? (
                                                                <div className="flex flex-col gap-0.5 mt-1">
                                                                    {Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([shift, count]) => (
                                                                        <span key={shift} className="shift-chip text-xs sm:text-sm font-bold text-slate-800 bg-white border border-slate-300 px-1.5 py-0.5 rounded shadow-sm">
                                                                            {shift}: <strong className="text-blue-700 text-sm sm:text-base">{count}</strong>
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            ) : <span className="text-slate-300">-</span>}
                                                        </td>
                                                    );
                                                })}
                                                <td colSpan={adminTab==='summary'?2:1} className="bg-amber-50 border-l border-slate-200"></td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    {((adminTab === 'summary' || adminTab === 'schedules') && !filterDept) && (
                        <div className="text-center py-12 bg-white rounded-2xl border border-gray-200 shadow-sm print-hide">
                            <i className="fa-solid fa-building text-3xl text-gray-300 mb-3"></i>
                            <p className="text-gray-500 font-medium">กรุณาเลือกแผนกเพื่อดูตารางเวร</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
